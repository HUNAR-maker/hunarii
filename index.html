.h3d-ring:before,.h3d-ring:after{

}

/* marketplace visual redesign - presentation only */
.marketPage{min-height:70vh;background:linear-gradient(180deg,#f7f8f6 0%,#eef2ee 42%,#f8f9f8 100%);overflow:hidden}
.marketHero{position:relative;color:#fff;padding:38px 0 24px;background:radial-gradient(circle at 82% 18%,rgba(166,220,105,.20),transparent 22%),linear-gradient(135deg,#101410 0%,#182019 52%,#242d25 100%);overflow:hidden;border-bottom:1px solid rgba(255,255,255,.08)}
.marketHero:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.035) 45%,transparent 68%),radial-gradient(circle at 12% 110%,rgba(255,255,255,.05),transparent 26%);pointer-events:none}
.marketHero:after{content:"";position:absolute;width:420px;height:420px;right:-170px;top:-220px;border:1px solid rgba(166,220,105,.16);border-radius:50%;box-shadow:0 0 0 36px rgba(166,220,105,.025),0 0 0 74px rgba(166,220,105,.018);transform:rotate(-18deg);pointer-events:none}
.marketHero .container{position:relative;z-index:1}
.marketTop{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:30px;align-items:end;max-width:1060px}
.marketTop:after{content:"H";position:absolute;right:80px;top:-34px;font-size:180px;line-height:1;font-weight:950;color:rgba(255,255,255,.035);transform:perspective(500px) rotateY(-18deg);pointer-events:none}
.marketTop h1{font-size:clamp(34px,4.8vw,58px);margin:9px 0 7px;letter-spacing:-2.6px;max-width:760px}
.marketTop p{color:#cbd4ce;max-width:700px;font-size:15px;line-height:1.65;margin:0}
.marketIntroRail{display:flex;justify-content:flex-end;gap:8px;align-items:center;position:relative;z-index:2}
.marketIntroRail span{display:block;padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.055);backdrop-filter:blur(12px);font-size:11px;color:#dfe7e1;box-shadow:0 16px 35px rgba(0,0,0,.12)}
.marketIntroRail i{display:block;width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px rgba(166,220,105,.55)}
.marketSearch{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.98);border:1px solid rgba(255,255,255,.65);border-radius:17px;padding:7px 8px;margin:24px 0 15px;max-width:900px;box-shadow:0 20px 55px rgba(0,0,0,.23),0 1px 0 rgba(255,255,255,.6) inset;transform:translateZ(0);transition:.28s ease}
.marketSearch:focus-within{box-shadow:0 22px 60px rgba(0,0,0,.24),0 0 0 4px rgba(166,220,105,.13);transform:translateY(-1px)}
.marketSearch span{color:#65726b;font-size:23px;padding-left:10px;line-height:1}
.marketSearch input{flex:1;border:0!important;outline:0;padding:12px 4px;color:#111815;background:transparent!important;box-shadow:none!important;transform:none!important;font-size:15px}
.marketSearch input::placeholder{color:#7a8580}
.marketSearch .btn{min-height:42px;padding:0 20px;border-radius:12px}
.marketTabs{display:flex;gap:7px;overflow:auto;padding:2px 0 3px;scrollbar-width:none}
.marketTabs::-webkit-scrollbar{display:none}
.marketTab{position:relative;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);color:#dce5df;border-radius:12px;padding:10px 14px;white-space:nowrap;font-weight:800;transition:.25s ease;backdrop-filter:blur(10px)}
.marketTab:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
.marketTab.active{background:var(--lime);border-color:var(--lime);color:#132014;box-shadow:0 9px 24px rgba(166,220,105,.17)}
.marketTab small{display:inline-grid;place-items:center;min-width:21px;height:19px;margin-left:7px;padding:0 5px;border-radius:99px;background:rgba(0,0,0,.12);font-size:9px}
.marketTab.active small{background:rgba(0,0,0,.12)}
.marketBody{padding-top:34px;padding-bottom:75px}
.marketSection{margin-bottom:42px}
.marketSectionHead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:15px}
.marketSectionHead h2{font-size:25px;letter-spacing:-.8px;margin:4px 0 0}
.marketSectionHead p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.marketRule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin-bottom:16px}
.marketFeatured{display:grid;grid-template-columns:1.55fr .85fr .85fr;gap:12px;min-height:320px}
.marketFeature{position:relative;overflow:hidden;border-radius:18px;border:1px solid rgba(18,25,21,.10);background:#dfe7e1;box-shadow:0 16px 42px rgba(17,24,21,.08);min-height:145px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.marketFeature:hover{transform:translateY(-5px) perspective(1000px) rotateX(1.2deg) rotateY(-1.2deg);box-shadow:0 28px 58px rgba(17,24,21,.14)}
.marketFeature:first-child{grid-row:span 2;min-height:320px}
.marketFeature img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .65s cubic-bezier(.2,.8,.2,1);filter:saturate(.95)}
.marketFeature:hover img{transform:scale(1.055)}
.marketFeature:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(7,11,8,.76));pointer-events:none}
.marketFeatureCopy{position:absolute;left:17px;right:17px;bottom:15px;z-index:2;color:#fff}
.marketFeatureCopy .tag{background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.16);backdrop-filter:blur(10px)}
.marketFeatureCopy h3{font-size:19px;margin:7px 0 3px;letter-spacing:-.3px}
.marketFeatureCopy p{font-size:11px;color:#e0e6e1;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.marketFeature.empty{display:grid;place-items:center;background:linear-gradient(135deg,#edf2ed,#dfe8df);color:#5e6d63;padding:20px;text-align:center}
.marketFeature.empty:after{display:none}
.marketFeature.empty:first-child{grid-row:span 2}
.marketFeature.empty b{font-size:13px}
.marketSplit{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;align-items:start}
.marketResults{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.marketResults.projectResults{grid-template-columns:repeat(2,minmax(0,1fr))}
.marketResultPanel{background:rgba(255,255,255,.72);border:1px solid rgba(18,25,21,.08);border-radius:18px;padding:14px;box-shadow:0 12px 34px rgba(17,24,21,.05)}
.marketResultPanel .marketToolbar{margin:0 0 12px;padding:0 0 11px;border-bottom:1px solid var(--line)}
.marketProject{position:relative;display:grid;grid-template-columns:190px 1fr;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;transition:.3s cubic-bezier(.2,.8,.2,1);min-height:205px;box-shadow:0 7px 20px rgba(17,24,21,.04)}
.marketProject:hover{transform:translateY(-4px);box-shadow:0 20px 45px rgba(17,24,21,.11)}
.marketProjectMedia{background:linear-gradient(135deg,#e7eee8,#dbe5dd);min-height:205px;overflow:hidden;display:grid;place-items:center;color:#58705f;font-weight:900;position:relative}
.marketProjectMedia:after{content:"";position:absolute;inset:auto 10px 10px auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.22);box-shadow:0 8px 20px rgba(17,24,21,.08)}
.marketProjectMedia img{width:100%;height:100%;object-fit:cover;transition:.55s ease;transform:scale(1.01)}
.marketProject:hover .marketProjectMedia img{transform:scale(1.065)}
.marketProjectBody{padding:17px}
.eyebrowSmall{font-size:9px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#64805f}
.marketProjectBody h3{margin:5px 0 6px;font-size:18px;letter-spacing:-.3px}
.marketProjectBody p{font-size:12px;margin:0 0 10px;line-height:1.55}
.marketProjectFoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:11px;color:var(--muted)}
.mini{padding:8px 11px!important;font-size:12px!important}
.marketEmpty{grid-column:1/-1;text-align:center;padding:46px 20px;background:rgba(255,255,255,.8);border:1px dashed #cbd5ce;border-radius:16px}
.emptyMark{font-size:30px;color:#829188;margin-bottom:5px}
.marketPeople{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.marketPerson{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0;transition:.3s ease;box-shadow:0 7px 20px rgba(17,24,21,.035);overflow:hidden}
.marketPerson:before{content:"";position:absolute;width:90px;height:90px;right:-30px;top:-34px;border-radius:50%;background:radial-gradient(circle,rgba(166,220,105,.20),transparent 70%);transition:.35s ease}
.marketPerson:hover{transform:translateY(-4px);box-shadow:0 20px 42px rgba(17,24,21,.10)}
.marketPerson:hover:before{transform:scale(1.35)}
.marketPersonTop{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.marketPersonAvatar{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#e1ebe0;border:3px solid #fff;box-shadow:0 8px 20px rgba(17,24,21,.12);flex:0 0 auto;transition:.35s ease}
.marketPerson:hover .marketPersonAvatar{transform:translateY(-2px) scale(1.035)}
.marketPersonAvatar img{width:100%;height:100%;object-fit:cover}
.marketPerson h3{font-size:14px;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marketPerson .title{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marketPersonMeta{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 8px;font-size:10px;color:#5c6962}
.marketPersonBio{font-size:11px;line-height:1.55;color:#5f6b65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.marketPersonFoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid #edf0ee;font-size:11px}
.marketServices{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:12px}
.marketServiceFeature{position:relative;overflow:hidden;border-radius:17px;min-height:265px;background:#dfe8e0;border:1px solid var(--line);box-shadow:0 12px 34px rgba(17,24,21,.07)}
.marketServiceFeature img{width:100%;height:100%;object-fit:cover;display:block;transition:.55s ease}
.marketServiceFeature:hover img{transform:scale(1.05)}
.marketServiceFeature:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(7,11,8,.8))}
.marketServiceCopy{position:absolute;z-index:2;left:16px;right:16px;bottom:14px;color:#fff}
.marketServiceCopy h3{margin:6px 0 3px;font-size:17px}
.marketServiceCopy p{font-size:11px;color:#e4eae6;margin:0}
.marketServiceCopy b{font-size:12px}
.marketServiceMini{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;display:grid;grid-template-columns:110px 1fr;min-height:125px;transition:.3s ease}
.marketServiceMini:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(17,24,21,.08)}
.marketServiceMini .media{background:#e7eee8;overflow:hidden}
.marketServiceMini img{width:100%;height:100%;object-fit:cover;transition:.45s ease}
.marketServiceMini:hover img{transform:scale(1.06)}
.marketServiceMini .copy{padding:12px}
.marketServiceMini h3{font-size:14px;margin:3px 0 6px}
.marketServiceMini p{font-size:10px;color:var(--muted);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.marketServiceMini .row{font-size:10px}
.marketJobs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.marketJob{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;transition:.28s ease}
.marketJob:hover{transform:translateX(3px);box-shadow:0 15px 34px rgba(17,24,21,.07)}
.marketJob h3{font-size:15px;margin:5px 0 4px}
.marketJob p{font-size:11px;margin:0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.marketJobMeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:10px;color:#59665f}
.marketJobAction{display:flex;align-items:center;justify-content:flex-end}
.marketSkills{display:flex;flex-wrap:wrap;gap:7px}
.marketSkill{position:relative;display:inline-flex;align-items:center;gap:7px;padding:9px 11px;border:1px solid #d6dfd9;border-radius:999px;background:rgba(255,255,255,.74);color:#334039;font-size:11px;font-weight:800;transition:.25s ease;box-shadow:0 5px 16px rgba(17,24,21,.025)}
.marketSkill:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green);transition:.25s ease}
.marketSkill:hover{background:#172019;color:#fff;border-color:#172019;transform:translateY(-2px)}
.marketSkill:hover:before{background:var(--lime);box-shadow:0 0 9px rgba(166,220,105,.5)}
.marketBottomBand{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;padding:18px;border-radius:19px;background:linear-gradient(135deg,#131914,#222b24);color:#fff;box-shadow:0 22px 50px rgba(17,24,21,.14);position:relative;overflow:hidden}
.marketBottomBand:after{content:"";position:absolute;right:-80px;top:-90px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(166,220,105,.17);box-shadow:0 0 0 35px rgba(166,220,105,.025),0 0 0 70px rgba(166,220,105,.018)}
.marketBottomBand h2{font-size:24px;margin:3px 0 5px;letter-spacing:-.6px}
.marketBottomBand p{font-size:12px;color:#c8d2cb;margin:0;max-width:620px;line-height:1.6}
.marketBottomStats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;align-self:center;position:relative;z-index:2}
.marketBottomStats div{padding:12px;background:rgba(255,255,255,.035)}
.marketBottomStats b{display:block;font-size:18px}.marketBottomStats span{font-size:9px;color:#b8c4bc;text-transform:uppercase;letter-spacing:.08em}
.marketPage .card,.marketPage .jobCard{transition:transform .28s ease,box-shadow .28s ease}
@media(max-width:1050px){.marketTop{grid-template-columns:1fr}.marketIntroRail{display:none}.marketFeatured{grid-template-columns:1.25fr .9fr;}.marketFeature:nth-child(3){display:none}.marketPeople{grid-template-columns:repeat(2,minmax(0,1fr))}.marketServices{grid-template-columns:1fr 1fr}.marketServiceFeature{grid-row:span 2}.marketJobs{grid-template-columns:1fr}.marketBottomBand{grid-template-columns:1fr}}
@media(max-width:950px){.marketResults,.marketResults.projectResults{grid-template-columns:repeat(2,minmax(0,1fr))}.marketFeatured{min-height:280px}.marketFeature:first-child{min-height:280px}.marketProject{grid-template-columns:145px 1fr}}
@media(max-width:700px){.marketHero{padding:30px 0 17px}.marketTop h1{font-size:35px;letter-spacing:-1.7px}.marketTop p{font-size:13px}.marketSearch{margin-top:20px;border-radius:15px}.marketSearch .btn{padding:0 14px}.marketTabs{margin-right:-14px;padding-right:14px}.marketBody{padding-top:25px}.marketSection{margin-bottom:32px}.marketSectionHead h2{font-size:21px}.marketFeatured{grid-template-columns:1fr 1fr;gap:9px;min-height:220px}.marketFeature:first-child{grid-column:span 2;grid-row:auto;min-height:220px}.marketFeature:nth-child(3){display:block}.marketResults,.marketResults.projectResults{grid-template-columns:1fr}.marketProject{grid-template-columns:115px 1fr;min-height:175px}.marketProjectMedia{min-height:175px}.marketProjectBody{padding:13px}.marketProjectBody h3{font-size:16px}.marketPeople{grid-template-columns:1fr 1fr}.marketServices{grid-template-columns:1fr}.marketServiceFeature{grid-row:auto;min-height:230px}.marketServiceMini{grid-template-columns:95px 1fr}.marketBottomStats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:470px){.marketTop h1{font-size:31px}.marketSearch input{font-size:13px}.marketSearch .btn{min-height:39px;padding:0 11px;font-size:12px}.marketFeatured{grid-template-columns:1fr;min-height:0}.marketFeature:first-child{grid-column:auto;min-height:220px}.marketFeature{min-height:135px}.marketFeature:nth-child(3){display:none}.marketPeople{grid-template-columns:1fr}.marketProject{grid-template-columns:1fr}.marketProjectMedia{height:155px;min-height:155px}.marketJob{grid-template-columns:1fr}.marketJobAction{justify-content:flex-start}.marketBottomBand{padding:16px}.marketBottomStats{grid-template-columns:1fr 1fr 1fr}.marketBottomStats div{padding:9px}.marketBottomStats b{font-size:15px}}
@media(prefers-reduced-motion:reduce){.marketFeature,.marketFeature img,.marketProject,.marketProjectMedia img,.marketPerson,.marketPersonAvatar,.marketServiceFeature img,.marketServiceMini,.marketServiceMini img,.marketSkill,.marketJob,.marketSearch{transition:none!important}}

;transition:.45s}.portfolioTile:hover .portfolioTileImage img{transform:scale(1.045)}.portfolioTileInfo{display:flex;justify-content:space-between;gap:10px}.portfolioTileInfo h3{font-size:17px;margin:2px 0}.portfolioTile p{font-size:12px;color:var(--muted);margin:7px 0}.twoSection{display:grid;grid-template-columns:1fr 1fr;gap:42px}.historyItem{display:flex;gap:13px;padding:10px 0}.historyMarker{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:8px;box-shadow:0 0 0 4px #e9f4e3}.historyItem h3{font-size:15px;margin:0 0 3px}.historyItem p{font-size:12px;margin:0}.credentialRow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf0ee}.credentialRow b{font-size:13px}.credentialRow span{font-size:11px;color:var(--muted)}.reviewRows{display:grid}.reviewRow{display:grid;grid-template-columns:100px 1fr;gap:18px;padding:14px 0;border-top:1px solid #edf0ee}.reviewScore{font-weight:900}.reviewRow p{margin:0 0 5px;font-size:13px}.compactEmpty{padding:16px 0;color:var(--muted);font-size:13px}

/* performance overview graphs */
.perfOverviewGraph{position:relative;padding:18px 18px 14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,#f8fbf7);overflow:hidden}

<style id="hunar-correction-v4">
/* V4 readability + sign-in flow + public metrics */
.footer{background:#111412!important;color:#fff!important;border-top-color:rgba(255,255,255,.14)!important}
.footer .logo,.footer h4,.footer p,.footer a,.footer span,.footerBottom{color:#fff!important}
.footer a{opacity:.88}.footer a:hover{opacity:1;color:#fff!important}
.footerBottom{border-top-color:rgba(255,255,255,.18)!important}
/* The internal marketplace closing banner is intentionally light so its copy is black/readable. */
.marketBottomBand{background:linear-gradient(135deg,#fff,#f2f6f3)!important;color:#111!important;border:1px solid #dce5df;box-shadow:0 22px 50px rgba(17,24,21,.08)!important}
.marketBottomBand h2,.marketBottomBand p,.marketBottomBand span{color:#111!important}
.marketBottomBand .tag{color:#3c6f35!important;background:#eaf6e8!important;border-color:#d0e8cb!important}
.marketBottomStats div{background:#fff!important;border-color:#dce5df!important}
.marketBottomStats b{color:#111!important}.marketBottomStats span{color:#536159!important}
/* Sign-in role is a separate first step, before email/password. */
.signinChoiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.signinChoice{background:#fff;border:1px solid #d9e3dd;border-radius:17px;padding:20px;text-align:left;cursor:pointer;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.signinChoice:hover{transform:translateY(-3px);border-color:#a9c9b7;box-shadow:0 14px 32px rgba(20,34,27,.09)}
.signinChoice .signinRoleIcon{margin-bottom:12px}
.signinChoice h2{font-size:22px!important;margin:0 0 6px}
.signinChoice p{margin:0 0 14px;color:#5f6b65}
.signinChoice .btn{width:100%}
.signinBack{margin-top:12px;width:100%}
/* Softer sign-up continue action: no glow. */
.signupRoute .btn.primary,.authWrap .btn.primary{box-shadow:none!important;text-shadow:none!important}
.signupRoute .btn.primary:hover,.authWrap .btn.primary:hover{box-shadow:0 7px 18px rgba(20,34,27,.08)!important}
/* Public homepage metrics */
.hunarPublicMetrics{padding:22px 0 8px;background:#fff;border-bottom:1px solid var(--line)}
.hunarMetricsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hunarMetric{position:relative;overflow:hidden;border:1px solid #dfe7e2;border-radius:16px;padding:17px 18px;background:linear-gradient(145deg,#fff,#f5f8f6);box-shadow:0 8px 24px rgba(20,34,27,.035);animation:hunarMetricIn .65s cubic-bezier(.2,.8,.2,1) both}
.hunarMetric:nth-child(2){animation-delay:.08s}.hunarMetric:nth-child(3){animation-delay:.16s}.hunarMetric:nth-child(4){animation-delay:.24s}
.hunarMetric:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-30px;top:-30px;background:rgba(98,168,91,.08);animation:hunarMetricPulse 3.6s ease-in-out infinite}
.hunarMetricLabel{display:block;font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#6b776f}
.hunarMetricValue{display:block;margin-top:5px;font-size:27px;font-weight:950;color:#14221b;letter-spacing:-.04em}
.hunarMetricNote{display:block;margin-top:2px;font-size:11px;color:#758078}
.hunarMetric.pending .hunarMetricValue{font-size:20px;color:#59665f}
@keyframes hunarMetricIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes hunarMetricPulse{50%{transform:scale(1.18);opacity:.65}}
@media(max-width:800px){.hunarMetricsGrid{grid-template-columns:1fr 1fr}.signinChoiceGrid{grid-template-columns:1fr}}
@media(max-width:480px){.hunarMetricsGrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.hunarMetric,.hunarMetric:after{animation:none!important}}
</style>

<script>
(function(){
  function showHunarToast(message,type){
    try{
      const host=document.querySelector('.hunarToastHost')||(()=>{const h=document.createElement('div');h.className='hunarToastHost';document.body.appendChild(h);return h})();
      const t=document.createElement('div');t.className='hunarToast '+(type||'info');
      const icon=type==='error'?'!':type==='success'?'✓':'i';
      const title=type==='error'?'Something needs attention':type==='success'?'HUNAR updated':'HUNAR';
      t.innerHTML='<div class="hunarToastIcon">'+icon+'</div><div class="hunarToastText"><div class="hunarToastTitle">'+title+'</div><div class="hunarToastMessage"></div></div>';
      t.querySelector('.hunarToastMessage').textContent=String(message||'');host.appendChild(t);setTimeout(()=>t.remove(),5200);
    }catch(e){console.warn('HUNAR toast failed',e)}

async function getHunarOnboardingState(user, roleHint=null){

async function handleAuthCallback(){
  if(!supabaseClient)return false;
  try{
    let {data,error}=await supabaseClient.auth.getSession();
    if(error)throw error;
    const params=new URLSearchParams(location.search);
    if(!data.session&&params.get('code')){
      const ex=await supabaseClient.auth.exchangeCodeForSession(params.get('code'));
      if(ex.error)throw ex.error;
      data=ex.data;
    }
    if(!data.session?.user)return false;
    const user=data.session.user;
    const intent=sessionStorage.getItem('hunar_google_role_intent')||null;
    if(!intent){
      const state=await getHunarOnboardingState(user,null);
      if(!state.complete){
        const role=state.role||user.user_metadata?.hunar_signup_role||null;
        if(!role){
          history.replaceState(null,'',window.location.pathname+'#google-role');
          render('google-role');
          return true;
        }
        productionUser=user;window.productionUser=user;
        const d=signupDraft(role);d.email=normalizeEmail(user.email);d.emailVerified=!!user.email_confirmed_at;d.authCreated=true;d.authEmail=normalizeEmail(user.email);d.resumedExistingAuth=true;d.name=d.name||user.user_metadata?.full_name||'';saveSignupDraft(role,d);
        history.replaceState(null,'',authRedirectUrl());
        alert('Your HUNAR registration is not finished yet. Complete your profile before you can sign in. We will resume your registration now.');
        go('register?role='+role+'&step='+(d.emailVerified?3:2));
        return true;
      }
      await finishAuthenticatedUser(user,null,{sync:true});
      history.replaceState(null,'',authRedirectUrl());
      render('dashboard');
      return true;
    }

    // Google signup is an authentication step only. Do not create the HUNAR
    // application account/profile until the final onboarding step.
    const signupState=await getHunarOnboardingState(user,intent);
    if(signupState.complete){
      await supabaseClient.auth.signOut();productionUser=null;window.productionUser=null;me=null;
      sessionStorage.removeItem('hunar_google_role_intent');window.hunarGoogleRoleIntent=null;
      alert('An account already exists with this email. Please sign in instead.');
      history.replaceState(null,'',authRedirectUrl());
      go('signin?role='+encodeURIComponent(signupState.role||intent));
      return true;
    }
    productionUser=user;window.productionUser=user;
    const d=signupDraft(intent);d.email=normalizeEmail(user.email);d.emailVerified=true;d.authCreated=true;d.authEmail=normalizeEmail(user.email);d.resumedExistingAuth=true;d.name=d.name||user.user_metadata?.full_name||'';saveSignupDraft(intent,d);
    await markAuthSignupStatus('incomplete',intent);
    sessionStorage.removeItem('hunar_google_role_intent');window.hunarGoogleRoleIntent=null;
    history.replaceState(null,'',authRedirectUrl());
    go('register?role='+intent+'&step=3');
    return true;
  }catch(e){console.error('Hunar auth callback:',e);alert(authMessage(e,'Google sign-in could not be completed. Please try again.'));return false}
}

async function bootProductionSession(){
  if(!supabaseClient){render(location.hash.slice(1)||'home');return}
  try{
    const params=new URLSearchParams(location.search);
    const raw=location.hash.slice(1)||'home';
    const current=(raw.split('?')[0]||'home');
    const isOAuthCallback=!!params.get('code')||current==='auth-callback';
    if(isOAuthCallback){
      render('auth-callback');
      if(await handleAuthCallback())return;
      history.replaceState(null,'',authRedirectUrl());
      productionUser=null;window.productionUser=null;me=null;
      render('signin');
      return;
    }
    // HUNAR intentionally does not auto-sign users in when the website is opened.
    // Any old Supabase browser session is cleared on a normal fresh website open.
    try{await supabaseClient.auth.signOut()}catch(e){console.warn('HUNAR startup sign-out:',e)}
    productionUser=null;window.productionUser=null;me=null;
    render(['home','signup','signin','forgot-password','reset-password'].includes(current)?current:'home');
  }catch(e){
    console.error('Hunar session bootstrap:',e);
    productionUser=null;window.productionUser=null;me=null;
    history.replaceState(null,'',window.location.pathname+window.location.search+'#home');
    render('home');
  }
}

function go(route){
  const next=String(route||'home');
  const current=location.hash.slice(1)||'home';
  if(current===next){ render(next); return; }
  try{
    const stack=JSON.parse(sessionStorage.getItem('hunar_app_history')||'[]');
    const currentRoute=String(current).split('?')[0];
    const nextRoute=String(next).split('?')[0];
    if(current&&current!==next){
      const last=stack[stack.length-1];
      if(last!==current && currentRoute!==nextRoute)stack.push(current);
      sessionStorage.setItem('hunar_app_history',JSON.stringify(stack.slice(-60)));
    }
  }catch(e){}
  // One click = one navigation = one render. Push the URL without firing hashchange,

  history.pushState(null,'',window.location.pathname+window.location.search+'#'+next);

function projectCard(p){const title=p?.title||p?.name||'Project';const category=p?.category||p?.cat||'Project work';const budget=p?.budget||((p?.budgetMin||p?.budgetMax)?`${money(p.budgetMin||0)} – ${money(p.budgetMax||0)} ETB`:'Budget available');const status=p?.status||'Open';const skills=Array.isArray(p?.skills)?p.skills.slice(0,4):[];const owner=p?.client?'<span class="muted">Client project</span>':'';return `<article class="projectCard"><div class="row"><span class="tag">${esc(status)}</span>${owner}</div><h3>${esc(title)}</h3><p class="muted">${esc(p?.description||p?.text||'A HUNAR project opportunity for qualified freelancers.')}</p><div class="chips">${skills.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}${category?`<span class="chip">${esc(category)}</span>`:''}</div><div class="row" style="margin-top:16px"><b>${esc(budget)}</b><button class="btn outline" type="button" onclick="go('project/${encodeURIComponent(p?.id||'')}')">View Project</button></div></article>`}
function projectExamples(){return [{id:'ex1',title:'Business Website Development',category:'Website Development',budget:'12,000–20,000 ETB',text:'Responsive website for a growing Ethiopian business.',status:'New opportunity'},{id:'ex2',title:'Social Media Content Creator',category:'Social Media Management',budget:'8,000 ETB / month',text:'Monthly content planning, design and publishing.',status:'New opportunity'},{id:'ex3',title:'Brand Identity Design',category:'Branding',budget:'7,000–12,000 ETB',text:'Logo and visual identity for a new local brand.',status:'New opportunity'}]}

function devCard(d){return `<div class="card"><div class="row"><div class="row" style="justify-content:flex-start"><div class="avatar">${d.photo?`<img src="${esc(d.photo)}" alt="${esc(d.n||'Profile photo')}">`:initials(d.n)}</div><div><b>${esc(d.n)}</b><div class="muted">${esc(d.t||d.profession||'Freelancer')}</div></div></div>${d.v?'<span class="badge">✓ Verified</span>':''}</div><p class="muted" style="margin-bottom:8px">📍 ${esc(d.l||d.city||'Ethiopia')} · ★ ${d.rating||'New'} · ${d.completed||0} completed</p><p>${esc(d.bio||'Professional Ethiopian freelancer ready for new projects.')}</p><div class="chips">${(d.cats||[]).slice(0,3).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="row" style="margin-top:16px"><b>From ${money(d.price)}</b><button class="btn primary" onclick="go('dev/${d.id}')">View Profile</button></div></div>`}
function developers(){let q=new URLSearchParams((location.hash.split('?')[1]||''));let query=q.get('q')||'';return `<section class="section"><div class="container"><div class="row"><div><span class="tag">HUNAR TALENT</span><h1>Find Freelancers</h1><p class="sectionLead">Search by profession, skill, category, location, availability, and verification.</p></div>${me?.role==='client'?`<button class="btn primary" type="button" onclick="go('dashboard')">Dashboard →</button>`:''}</div><div class="toolbar"><input class="grow" id="dq" value="${esc(query)}" placeholder="Search freelancer, profession, or skill" oninput="filterDev()"><select id="dc" onchange="filterDev()"><option value="">All categories</option>${S.categories.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><select id="dv" onchange="filterDev()"><option value="">Any availability</option><option>Available now</option><option>This week</option></select><label class="chip" style="align-items:center"><input type="checkbox" id="ver" onchange="filterDev()"> Verified</label></div><div id="devgrid" class="grid3">${filterDevHtml(query)}</div></div></section>`}
function filterDevHtml(query=''){let q=query.toLowerCase(),c='',v='',ok=false;let arr=publicFreelancers().filter(d=>(!q||(d.n+' '+(d.t||'')+' '+(d.profession||'')+' '+(d.bio||'')+' '+(d.skills||[]).join(' ')+' '+(d.cats||[]).join(' ')).toLowerCase().includes(q)));return arr.length?arr.map(devCard).join(''):'<div class="card"><b>No freelancers found.</b><p class="muted">Try another skill or profession.</p></div>'}
function filterDev(){let q=(document.getElementById('dq')?.value||'').toLowerCase(),c=document.getElementById('dc')?.value||'',v=document.getElementById('dv')?.value||'',ok=document.getElementById('ver')?.checked||false;let arr=publicFreelancers().filter(d=>(!q||(d.n+' '+(d.t||'')+' '+(d.profession||'')+' '+(d.bio||'')+' '+(d.skills||[]).join(' ')+' '+(d.cats||[]).join(' ')).toLowerCase().includes(q))&&(!c||(d.cats||[]).includes(c))&&(!v||(d.availability===v))&&(!ok||d.v));document.getElementById('devgrid').innerHTML=arr.length?arr.map(devCard).join(''):'<div class="card"><b>No freelancers found.</b><p class="muted">Try another filter.</p></div>'}
function dev(id){let d=devData(id),services=S.services.filter(s=>s.uid===id),ps=S.portfolios.filter(p=>p.uid===id),reviews=S.reviews.filter(r=>r.uid===id);return `<section class="section"><div class="container"><button class="btn outline" onclick="backSafe()">← Back</button><div class="card" style="margin-top:15px"><div class="row" style="align-items:flex-start"><div class="row" style="justify-content:flex-start"><div class="avatar" style="width:78px;height:78px;font-size:25px">${d.photo?`<img src="${esc(d.photo)}" alt="${esc(d.n||'Profile photo')}">`:initials(d.n)}</div><div><h1 style="margin:0">${esc(d.n)}</h1><p class="muted">${esc(d.t||d.profession||'Freelancer')} · 📍 ${esc(d.l||d.city||'Ethiopia')}</p><p>★ ${d.rating||'New'} · ${d.completed||0} completed ${d.v?'<span class="badge">✓ Verified</span>':'<span class="tag">Verification pending</span>'}</p></div></div><div><b>From ${money(d.price)}</b></div></div><p style="max-width:800px">${esc(d.bio||'')}</p><div class="chips">${(d.cats||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="actions"><button class="btn primary" onclick="messageDev('${id}')">Message</button><button class="btn outline" onclick="saveDev('${id}')">${isSavedFreelancer(id)?'Saved':'Save Freelancer'}</button></div></div><h2 style="margin-top:35px">Portfolio</h2><div class="grid3">${ps.length?ps.map(portCard).join(''):'<div class="card"><p class="muted">No portfolio projects yet.</p></div>'}</div><h2 style="margin-top:35px">Services</h2><div class="grid3">${services.length?services.map(serviceCard).join(''):'<div class="card"><p class="muted">No services published yet.</p></div>'}</div><h2 style="margin-top:35px">Reviews</h2><div class="grid3">${reviews.length?reviews.map(r=>`<div class="card"><b>★ ${r.overall}</b><p>${esc(r.text)}</p><small class="muted">Quality ${r.quality} · Communication ${r.communication} · Timeliness ${r.timeliness}</small></div>`).join(''):'<div class="card"><p class="muted">Reviews appear after completed work.</p></div>'}</div></div></section>`}
function portCard(p){return `<div class="card"><div class="thumb">${esc((p.title||'P').slice(0,1))}</div><h3>${esc(p.title)}</h3><p class="muted">${esc(p.description)}</p><p><b>Tools:</b> ${esc((p.tools||[]).join(', '))}</p><p><b>Role:</b> ${esc(p.role||'')}</p>${p.url?`<p><a href="${esc(p.url)}" target="_blank" rel="noopener" class="tag">View live project</a></p>`:''}</div>`}
function services(){let qs=new URLSearchParams(location.hash.split('?')[1]||''),cat=qs.get('cat')||'',uid=qs.get('uid')||'';let arr=S.services.filter(s=>(!cat||s.category===cat)&&(!uid||s.uid===uid));return `<section class="section"><div class="container"><span class="tag">READY TO HIRE</span><h1>Services</h1><p class="sectionLead">Compare clear service packages from Ethiopian freelancers.</p><div class="toolbar"><input id="sq" class="grow" placeholder="Search services" oninput="filterServices()"><select id="sc" onchange="filterServices()"><option value="">All categories</option>${S.categories.map(c=>`<option ${c.name===cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input id="maxp" type="number" placeholder="Max ETB" oninput="filterServices()"><label class="chip"><input type="checkbox" id="sv" onchange="filterServices()"> Verified</label></div><div id="servicegrid" class="grid3">${arr.length?arr.map(serviceCard).join(''):'<div class="card">No matching services yet.</div>'}</div></div></section>`}
function serviceCard(s){let d=devData(s.uid),mine=me?.role==='freelancer'&&s.uid===me.id;return `<div class="card"><div class="thumb" style="${s.image?`background-image:url('${esc(s.image)}');background-size:cover;background-position:center;color:transparent`:''}">${s.image?'':esc((s.category||'S').slice(0,1))}</div><p class="muted">${esc(s.category)}</p><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p><div class="row"><b>From ${money(s.price)}</b><span>${s.delivery} days</span></div><p>★ ${d.rating||'New'} ${d.v?'<span class="badge">✓ Verified</span>':''}</p><div class="actions"><button class="btn primary" onclick="go('service/${s.id}')">View Service</button>${mine?`<button class="btn outline" onclick="go('service-edit/${s.id}')">Edit</button>`:''}</div></div>`}
function homeServiceCard(s){let d=devData(s.uid);return `<article class="homeServiceCard"><div class="homeServiceVisual">${s.image?`<img src="${esc(s.image)}" alt="${esc(s.title)}">`:`<span>${esc((s.category||'S').slice(0,1))}</span>`}</div><div class="homeServiceBody"><span class="homeServiceCat">${esc(s.category||'SERVICE')}</span><h3>${esc(s.title||'HUNAR service')}</h3><div class="homeServiceMeta"><b>From ${money(s.price)}</b><span>${esc(s.delivery||0)} days</span></div>${d.v?'<span class="homeServiceVerified">✓ Verified</span>':''}<button class="btn primary" type="button" onclick="go('service/${esc(s.id)}')">View Service</button></div></article>`}
function filterServices(){let q=(document.getElementById('sq')?.value||'').toLowerCase(),c=document.getElementById('sc')?.value||'',m=Number(document.getElementById('maxp')?.value||0),v=document.getElementById('sv')?.checked||false;let arr=S.services.filter(s=>(s.title+' '+s.description+' '+s.category).toLowerCase().includes(q)).filter(s=>!c||s.category===c).filter(s=>!m||s.price<=m).filter(s=>!v||devData(s.uid).v);document.getElementById('servicegrid').innerHTML=arr.length?arr.map(serviceCard).join(''):'<div class="card">No matching services.</div>'}
function hireService(serviceId){
  const s=S.services.find(x=>x.id===serviceId);
  if(!s){alert('This service is no longer available.');return}
  if(!me||me.role!=='client'){go('signin');return}
  if(!productionUser){alert('Please sign in with a real Hunar account.');return}
  go('post');
}
function projectDetail(id){
  const real=S.projects.find(x=>String(x.id)===String(id));
  const demo=!real?projectExamples().find(x=>String(x.id)===String(id)):null;
  const p=real||demo;
  if(!p)return notFound();
  const isFreelancer=me?.role==='freelancer', isClient=me?.role==='client';
  const canApply=!!real&&isFreelancer&&(p.status==='Posted'||p.status==='posted'||!p.status);
  const existingApps=(S.applications||[]).filter(a=>String(a.projectId)===String(p.id)&&a.uid===me?.id);
  const skills=Array.isArray(p.skills)?p.skills.slice(0,5):[];
  const saved=isProjectSaved(p.id);
  const budget=p.budget||((p.budgetMin||p.budgetMax)?`${money(p.budgetMin||0)} – ${money(p.budgetMax||0)}`:'Budget available');
  const deadline=p.deadline||p.dueDate||'Not specified';
  const status=p.status||'Open';
  const brief=p.description||p.text||'Client project opportunity.';
  const clientProfile=p.client?S.profiles.find(x=>String(x.id)===String(p.client)):null;
  return `<section class="section pageEnter projectSimplePage"><div class="container">
    <div class="simpleProjectTop"><button class="btn outline" type="button" onclick="backSafe()">← Back</button><div class="simpleProjectActions"><button class="btn outline" type="button" onclick="saveProject('${esc(p.id)}')">${saved?'★ Saved':'☆ Save'}</button><button class="btn outline" type="button" onclick="shareProject('${esc(p.id)}')">Share</button></div></div>
    <div class="simpleProjectHero"><div><span class="tag">${esc(status)}</span><span class="simpleProjectCategory">${esc(p.category||'Project')}</span><h1>${esc(p.title)}</h1><p>${esc(brief)}</p><div class="chips">${skills.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div><div class="simpleProjectOrb"><div></div><span>PROJECT</span></div></div>
    <div class="simpleProjectGrid"><main><div class="simpleFacts"><div><span>Budget</span><b>${esc(budget)}</b></div><div><span>Deadline</span><b>${esc(deadline)}</b></div><div><span>Work type</span><b>${esc(p.workType||p.type||'Remote')}</b></div></div>${p.requirements||p.deliverables?`<article class="card simpleProjectCard"><h2>Project details</h2>${p.requirements?`<p><b>Requirements</b><br>${esc(p.requirements)}</p>`:''}${p.deliverables?`<p><b>Deliverables</b><br>${esc(p.deliverables)}</p>`:''}</article>`:''}<article class="card simpleProjectCard"><h2>Skills</h2><div class="chips">${skills.length?skills.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="muted">See project description</span>'}</div></article></main><aside class="simpleProjectSide"><article class="card simpleActionCard"><h2>${canApply?'Ready to apply?':demo?'Preview project':'Project status'}</h2>${demo?`<p>This is a HUNAR preview.</p>${!me?`<button class="btn primary full" type="button" onclick="go('signup')">Join HUNAR</button>`:''}`:canApply?(existingApps.length?`<p>You've already applied.</p><button class="btn primary full" type="button" onclick="go('applications')">My Applications</button>`:`<p>Send your proposal and price.</p><button class="btn primary full" type="button" onclick="go('apply/${esc(p.id)}')">Apply for Job →</button>`):isClient&&String(p.client)===String(me.id)?`<p>This is your project.</p><button class="btn primary full" type="button" onclick="go('workspace/${esc(p.id)}')">Open Workspace</button>`:!me?`<p>Sign in as a freelancer to apply.</p><button class="btn primary full" type="button" onclick="go('signin?role=freelancer')">Sign In</button>`:`<p>This project is not accepting applications.</p>`}</article><article class="card simpleClientCard"><span class="eyebrowSmall">CLIENT</span><h3>${clientProfile?esc(clientProfile.name||clientProfile.full_name||'HUNAR Client'):'HUNAR Client'}</h3><p>${clientProfile?esc(clientProfile.city||clientProfile.location||'Client account'):'Project client'}</p></article></aside></div>
  </div></section>`;
}
function isProjectSaved(id){try{return JSON.parse(localStorage.getItem('hunar_saved_projects')||'[]').map(String).includes(String(id))}catch(e){return false}}

async function sendSignupEmailOtp(role){
  const draft=signupDraft(role),cleanEmail=normalizeEmail(draft.email),password=role==='freelancer'?freelancerSignupSecret:clientSignupSecret;
  if(!cleanEmail)throw new Error('Please enter a valid email address.');
  if(!password||password.length<8)throw new Error('Password must contain at least 8 characters.');
  if(!supabaseClient)throw new Error('Supabase authentication is unavailable.');
  const pendingSameEmail=!!draft.authCreated&&normalizeEmail(draft.authEmail||'')===cleanEmail&&!draft.emailVerified;
  
  let resumedExistingAuth=false;

  if(!pendingSameEmail){
    let signupData=null,signupError=null;
    try{
      const result=await supabaseClient.auth.signUp({email:cleanEmail,password,options:{data:{role,full_name:draft.name,phone:draft.phone||null,hunar_signup_status:'incomplete',hunar_signup_role:role}}});
      signupData=result.data;signupError=result.error;
    }catch(error){signupError=error}

    const duplicateIdentity=!!signupData?.user?.identities&&signupData.user.identities.length===0;
    const alreadyExists=!!signupError&&/already registered|already exists|user already registered/i.test(String(signupError.message||signupError));
    if(signupError&&!alreadyExists){throw signupError;}

    if(alreadyExists||duplicateIdentity){
      // ONE EMAIL = ONE HUNAR SIGNUP until onboarding is complete.
      // Never create a second signup/account for the same email. If the
      // existing Auth user has not finished HUNAR onboarding, authenticate
      // the owner with the supplied password and resume that exact signup.
      // If the HUNAR account is already complete, stop immediately and send
      // the user to normal Sign In instead.
      let resumed=false;
      try{
        const loginResult=await supabaseClient.auth.signInWithPassword({email:cleanEmail,password});
        if(loginResult.error)throw loginResult.error;
        if(!loginResult.data?.user)throw new Error('The existing signup could not be resumed.');
        const state=await getHunarOnboardingState(loginResult.data.user,role);
        if(state.complete){
          await supabaseClient.auth.signOut();
          const e=new Error('This email already belongs to a completed HUNAR account. Please use Sign In.');e.code='HUNAR_ACCOUNT_EXISTS';throw e;
        }
        // Existing Auth identity + incomplete HUNAR profile means this email
        // is reserved for the unfinished signup. It cannot start a new account.
        resumed=true;
      }catch(resumeError){
        if(resumeError?.code==='HUNAR_ACCOUNT_EXISTS')throw resumeError;
        // If the Auth user is still unconfirmed, password sign-in may fail.
        // We can still send the email OTP; ownership will be proven by that code.
        const raw=String(resumeError?.message||resumeError||'').toLowerCase();
        if(!raw.includes('email not confirmed')&&!raw.includes('email_not_confirmed')&&!raw.includes('invalid login credentials')&&!raw.includes('invalid password')){
          console.error('HUNAR incomplete signup resume check:',resumeError);
          throw resumeError;
        }
        console.warn('HUNAR existing incomplete signup will resume through email OTP:',resumeError?.message||resumeError);
      }
      resumedExistingAuth=true;
      draft.authCreated=true;draft.authEmail=cleanEmail;draft.resumedExistingAuth=true;
      console.log('HUNAR RESUMING INCOMPLETE AUTH SIGNUP:',cleanEmail,{resumed});
    }else{
      draft.authCreated=true;draft.authEmail=cleanEmail;draft.resumedExistingAuth=false;
      await markAuthSignupStatus('incomplete',role);
    }
  }else{
    console.log('HUNAR RESUMING INCOMPLETE SIGNUP:',cleanEmail);
  }

  // Do not allow a second Auth identity to be created for an unfinished
  // registration. Supabase Auth itself enforces unique email identities;
  // this branch only ever verifies/resumes the existing identity.
  console.log('HUNAR SINGLE-EMAIL SIGNUP LOCK:',cleanEmail,{pendingSameEmail,resumedExistingAuth});
  console.log('HUNAR EMAIL OTP REQUEST EMAIL:',cleanEmail);
  const otp=await supabaseClient.auth.signInWithOtp({email:cleanEmail,options:{shouldCreateUser:false}});
  if(otp.error){console.error('HUNAR OTP REQUEST ERROR:',otp.error);throw otp.error;}
  draft.email=cleanEmail;draft.authCreated=true;draft.authEmail=cleanEmail;draft.resumedExistingAuth=!!(draft.resumedExistingAuth||resumedExistingAuth);saveSignupDraft(role,draft);
  hunarEmailResendUntil=Date.now()+60000;
  return otp.data;
}

async function verifySignupEmail(e,role){
  e.preventDefault();
  if(hunarEmailVerifyInFlight)return;
  const form=e.target,
        draft=signupDraft(role),
        cleanEmail=String(draft.email||'').trim().toLowerCase(),
        cleanToken=String(new FormData(form).get('token')||'').trim(),
        status=document.getElementById('emailConfirmStatus'),
        submit=form.querySelector('button[type="submit"]');
  if(!/^\d{6}$/.test(cleanToken)){
    if(status)status.textContent='Enter the 6-digit verification code.';
    return;
  }
  if(!cleanEmail){
    if(status)status.textContent='Your verification email is missing. Please restart signup.';
    return;
  }
  if(!supabaseClient){
    if(status)status.textContent='Hunar authentication is unavailable. Please try again.';
    return;
  }
  hunarEmailVerifyInFlight=true;
  hunarSignupEmailVerificationInProgress=true;
  hunarSignupEmailVerificationHandled=false;
  if(submit)submit.disabled=true;
  console.log('HUNAR OTP VERIFY TOKEN LENGTH:',cleanToken.length);
  try{
    const {data,error}=await supabaseClient.auth.verifyOtp({
      email:cleanEmail,
      token:cleanToken,
      type:'email'
    });
    if(error){
      console.error('HUNAR OTP VERIFY ERROR', {message:error?.message,code:error?.code,status:error?.status,name:error?.name});
      if(status)status.textContent=authErrorMessage(error,'Incorrect verification code. Please try again.');
      return;
    }
    console.log('HUNAR OTP VERIFIED SUCCESSFULLY');
    const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError)throw sessionError;
    if(!sessionData.session?.user)throw new Error('No authenticated Supabase session was returned after email verification.');

    draft.email=cleanEmail;
    draft.emailVerified=true;
    draft.authCreated=true;
    if(draft.resumedExistingAuth){
      const password=role==='freelancer'?freelancerSignupSecret:clientSignupSecret;
      if(password&&password.length>=8){
        const {error:passwordError}=await supabaseClient.auth.updateUser({password});
        if(passwordError)throw passwordError;
      }
    }
    await markAuthSignupStatus('incomplete',role);
    saveSignupDraft(role,draft);

    // IMPORTANT: email OTP verification proves ownership, but it must NOT create
    // the HUNAR application account/profile yet. The account is created only
    // after the final onboarding step. Keep the authenticated Supabase session
    // temporarily so the user can continue the 9-step registration.
    productionUser=sessionData.session.user;
    window.productionUser=sessionData.session.user;
    me={id:sessionData.session.user.id,role,email:cleanEmail,phone:draft.phone||'',emailVerified:true,phoneVerified:false};
    hunarSignupEmailVerificationHandled=true;
    if(role==='freelancer'&&window.hunarPendingFreelancerPhoto){
      const path=sessionData.session.user.id+'/'+crypto.randomUUID()+'.'+window.hunarPendingFreelancerPhoto.name.split('.').pop().toLowerCase();
      const up=await HunarData.storage.upload('hunar-avatars',path,window.hunarPendingFreelancerPhoto);
      draft.photo=up.publicUrl||draft.photo;
      window.hunarPendingFreelancerPhoto=null;
      saveSignupDraft(role,draft);
    }
    hunarEmailResendUntil=0;
    if(hunarEmailCountdownTimer){clearTimeout(hunarEmailCountdownTimer);hunarEmailCountdownTimer=null}
    if(status)status.textContent='Email verified successfully.';
    go('register?role='+role+'&step=3');
  }catch(err){
    console.error('HUNAR OTP VERIFY ERROR:',err);
    if(status)status.textContent=authErrorMessage(err,'Email verification could not be completed. Please try again.');
  }finally{
    hunarEmailVerifyInFlight=false;
    hunarSignupEmailVerificationInProgress=false;
    if(submit)submit.disabled=false;
  }
}

function renderSupportMessages(){const box=document.getElementById('supportMessages');if(!box)return;const arr=supportMessages().filter(x=>!me||x.uid===me.id);box.innerHTML=arr.map(x=>`<div class="supportBubble ${x.from==='user'?'mine':''}"><b>${x.from==='user'?'You':'HUNAR Team'}</b><div>${esc(x.body)}</div><small style="opacity:.65">${esc(x.at)}</small></div>`).join('')||'<p class="muted">Start a conversation with the HUNAR Team.</p>';box.scrollTop=box.scrollHeight}
function sendSupportMessage(e){e.preventDefault();if(!me){go('signin');return}const body=String(new FormData(e.target).get('body')||'').trim();if(!body)return;const violation=messagePolicyViolation(body);if(violation){const s=document.getElementById('supportStatus');if(s)s.textContent=violation;return}saveSupportMessage({uid:me.id,from:'user',body,at:new Date().toLocaleString()});e.target.reset();const s=document.getElementById('supportStatus');if(s)s.textContent='Message sent to HUNAR Support.';renderSupportMessages()}
function supportChat(){if(!me){go('signin');return ''}setTimeout(renderSupportMessages,0);return `<section class="section pageEnter"><div class="container supportChat"><div class="authHead"><span class="tag">HUNAR SUPPORT</span><h1>Chat with HUNAR Team</h1><p class="sectionLead">Ask a question or report a problem. Keep your message clear and never send passwords or OTP codes.</p></div><div class="card"><div id="supportMessages" class="supportMessages"></div><form onsubmit="sendSupportMessage(event)"><textarea name="body" required minlength="2" maxlength="4000" placeholder="How can the HUNAR Team help?"></textarea><div id="supportStatus" class="notice" style="margin-top:10px">Support messages are kept in this HUNAR support thread.</div><div class="actions"><button class="btn primary" type="submit">Send to HUNAR Team</button><button class="btn outline" type="button" onclick="go('messages')">Back to Messages</button></div></form></div></div></section>`}
function stopMessagesLiveRefresh(){if(hunarMessagePoll){clearInterval(hunarMessagePoll);hunarMessagePoll=null}}
function refreshMessagesInPlace(opts={}){
  if(!me||!document.querySelector('.messagesPage'))return;
  const currentHash=location.hash.slice(1)||'messages';
  const currentParams=new URLSearchParams(currentHash.split('?')[1]||'');const currentWith=currentParams.get('with')||'';const currentConversation=currentParams.get('conversation')||'';const currentProject=currentParams.get('project')||'';
  const active=document.activeElement;
  const composer=document.querySelector('.threadComposer textarea');
  const draft=composer?composer.value:'';
  const hadFocus=!!(composer&&active===composer);
  const body=document.querySelector('.conversationBody');
  const wasNearBottom=body?body.scrollHeight-body.scrollTop-body.clientHeight<90:false;
  const host=document.createElement('div');
  host.innerHTML=messages();
  const next=host.querySelector('.messagesWorkspace');
  const current=document.querySelector('.messagesWorkspace');
  if(!next||!current)return;
  current.replaceWith(next);
  const nextComposer=document.querySelector('.threadComposer textarea');
  if(nextComposer&&draft)nextComposer.value=draft;
  if(opts.scrollToBottom||wasNearBottom){const nextBody=document.querySelector('.conversationBody');if(nextBody)nextBody.scrollTop=nextBody.scrollHeight;}
  if(opts.focusComposer||hadFocus){nextComposer?.focus();if(nextComposer)nextComposer.setSelectionRange(nextComposer.value.length,nextComposer.value.length);}
}
function startMessagesLiveRefresh(){stopMessagesLiveRefresh();if(!me||!supabaseClient)return;hunarMessagePoll=setInterval(async()=>{if((location.hash.slice(1)||'').split('?')[0]!=='messages'){stopMessagesLiveRefresh();return}try{const before=JSON.stringify((S.messages||[]).map(m=>m.id+':'+m.text+':'+m.at));await syncProductionData();const after=JSON.stringify((S.messages||[]).map(m=>m.id+':'+m.text+':'+m.at));if(before!==after){
      // Never refresh the browser. Preserve an active draft/voice recording.
      if(!hunarVoiceRecorder||hunarVoiceRecorder.state!=='recording'){refreshMessagesInPlace({scrollToBottom:true});}
    }}catch(err){console.warn('HUNAR message refresh:',err?.message||err)}},4000)}

function openContractFromConversation(contractId){if(contractId)go('contract/'+encodeURIComponent(contractId));}
function createContractFromConversation(projectId,otherId,conversationId){
  // IMPORTANT: this button must always open the dedicated Create Contract page.
  // Never send an already-signed-in user through Sign In/Dashboard.
  if(!me){go('signin?role=client');return}
  const q=new URLSearchParams();
  if(projectId&&projectId!=='null'&&projectId!=='undefined')q.set('project',String(projectId));
  if(otherId&&otherId!=='null'&&otherId!=='undefined')q.set('with',String(otherId));
  if(conversationId&&conversationId!=='null'&&conversationId!=='undefined')q.set('conversation',String(conversationId));
  const target='create-contract'+(q.toString()?'?'+q.toString():'');
  // Create Contract is a dedicated HUNAR route. Use the hash directly so this also
  // works reliably when HUNAR is opened from a local file:// URL.
  try{
    history.pushState(null,'',window.location.pathname+window.location.search+'#'+target);
    render(target);
  }catch(e){
    location.hash='#'+target;
    setTimeout(()=>render(target),0);
  }
}
function contractApplicationFor(projectId,otherId,rows){
  const list=Array.isArray(rows)?rows:[];
  return list.find(x=>String(x.projectId??x.project_id)===String(projectId)&&String(x.uid??x.freelancer_id??x.freelancerId)===String(otherId)&&String(x.status||'').toLowerCase()==='accepted')||null;
}
function contractApplicationForFreelancer(otherId,rows){
  const list=Array.isArray(rows)?rows:[];
  return list.find(x=>String(x.uid??x.freelancer_id??x.freelancerId)===String(otherId)&&String(x.status||'').toLowerCase()==='accepted')||null;
}
function contractApplicationForHiredProject(projectId,otherId,rows,projects){
  const list=Array.isArray(rows)?rows:[];
  const project=(Array.isArray(projects)?projects:[]).find(p=>String(p.id)===String(projectId));
  const hiredId=project?.developer||project?.hired_freelancer_id||project?.hiredFreelancerId||project?.hired_freelancer||'';
  const accepted=list.filter(x=>String(x.projectId??x.project_id)===String(projectId)&&String(x.status||'').toLowerCase()==='accepted');

function contractAmountFromApplication(a,project){
  return Number(a?.proposed??a?.proposed_price_etb??0)||Number(project?.budgetMax||project?.budget_min_etb||project?.budgetMin||project?.budget_max_etb||0)||0;
}

async function createContractFromConversationSubmit(event){
  event.preventDefault();
  if(!me||me.role!=='client'){go('signin?role=client');return}
  const form=event.target;
  let projectId=form.elements.project_id.value,otherId=form.elements.other_id.value,conversationId=form.elements.conversation_id?.value||'',title=form.elements.title.value.trim(),description=form.elements.description.value.trim(),amount=Number(form.elements.amount.value);
  if(!otherId){alert('This conversation must be connected to a freelancer.');return}
  if(!title){alert('Please enter a contract title.');return}
  if(!description){alert('Please add the agreed work description.');return}
  if(!Number.isFinite(amount)||amount<=0){alert('Enter a valid contract amount in ETB.');return}
  const button=form.querySelector('button[type=submit]');if(button){button.disabled=true;button.textContent='Creating…'}
  try{
    // Resolve the real conversation participant and project from Supabase when the
    // browser URL does not carry a valid project/freelancer id. This keeps contract
    // creation tied to the actual conversation instead of stale URL data.
    if(conversationId&&supabaseClient){
      const {data:conv,error:convError}=await supabaseClient.from('conversations').select('id,project_id').eq('id',conversationId).maybeSingle();
      if(convError)throw convError;
      if(conv?.project_id)projectId=String(conv.project_id);
      const {data:members,error:membersError}=await supabaseClient.from('conversation_members').select('account_id').eq('conversation_id',conversationId);
      if(membersError)throw membersError;
      const participant=(members||[]).find(x=>String(x.account_id)!==String(me.id));
      if(participant?.account_id)otherId=String(participant.account_id);
    }
    const apps=await HunarData.applications.forClient();
    let a=projectId?((apps||[]).find(x=>String(x.projectId??x.project_id)===String(projectId)&&String(x.uid??x.freelancer_id??x.freelancerId)===String(otherId))||((S.applications||[]).find(x=>String(x.projectId??x.project_id)===String(projectId)&&String(x.uid??x.freelancer_id??x.freelancerId)===String(otherId)))):null;
    if(!a&&!projectId)a=(apps||[]).find(x=>String(x.uid??x.freelancer_id??x.freelancerId)===String(otherId))||((S.applications||[]).find(x=>String(x.uid??x.freelancer_id??x.freelancerId)===String(otherId)));
    const actualFreelancerId=String(a?.uid??a?.freelancer_id??a?.freelancerId??otherId);
    if(!actualFreelancerId)throw new Error('The freelancer could not be identified.');
    const appId=a?.id||null;
    if(a&&!projectId)projectId=String(a.projectId??a.project_id??'');
    const rows=[...form.querySelectorAll('.contractMilestoneRow')];
    const milestones=rows.map(row=>({title:String(row.querySelector('[name="milestone_title[]"]')?.value||'').trim(),amount_etb:Number(row.querySelector('[name="milestone_amount[]"]')?.value||0)})).filter(x=>x.title||x.amount_etb);
    if(milestones.length){
      const sum=Number(milestones.reduce((n,x)=>n+x.amount_etb,0).toFixed(2));
      if(milestones.some(x=>!x.title||!Number.isFinite(x.amount_etb)||x.amount_etb<=0))throw new Error('Complete each milestone title and amount.');
      if(sum!==Number(amount.toFixed(2)))throw new Error('Milestone amounts must equal the contract total.');
    }
    const existing=(await HunarData.contracts.list()).find(c=>String(c.client_id)===String(me.id)&&String(c.freelancer_id)===String(actualFreelancerId)&&['offered','active'].includes(String(c.status||'').toLowerCase())&&(!c.project_id||!projectId||String(c.project_id)===String(projectId)));
    if(existing){go('contract/'+encodeURIComponent(existing.id));return}
    const id=appId?await HunarData.contracts.create(appId,title,description,amount,milestones):await HunarData.contracts.createDirect(actualFreelancerId,title,description,amount,milestones);
    await syncProductionData();
    go('contract/'+encodeURIComponent(id));
  }catch(err){console.error('HUNAR create contract:',err);alert(err?.message||'The contract could not be created.');if(button){button.disabled=false;button.textContent='Create Contract →'}}
}

async function startContractFromConversation(applicationId){
  if(!me||me.role!=='client'){go('signin?role=client');return}
  try{const apps=await HunarData.applications.forClient();const a=(apps||[]).find(x=>String(x.id)===String(applicationId));if(!a)throw new Error('The hired application could not be found.');const existing=(await HunarData.contracts.list()).find(c=>String(c.project_id)===String(a.projectId)&&['offered','active'].includes(String(c.status||'').toLowerCase()));if(existing){go('contract/'+encodeURIComponent(existing.id));return}const project=(S.projects||[]).find(p=>String(p.id)===String(a.projectId));let amount=contractAmountFromApplication(a,project);if(!amount&&supabaseClient){const raw=await supabaseClient.from('applications').select('proposed_price_etb,project_id,freelancer_id,status').eq('id',a.id).maybeSingle();if(!raw.error&&raw.data)amount=Number(raw.data.proposed_price_etb||0)}if(!amount)amount=Number(project?.budgetMax||project?.budgetMin||0);if(!amount)throw new Error('The hired proposal does not have a valid contract amount.');const id=await HunarData.contracts.create(a.id,project?.title||'HUNAR Project Contract','Contract for the agreed project work.',amount);await syncProductionData();go('contract/'+encodeURIComponent(id));}
  catch(err){console.error('HUNAR start contract:',err);alert(err?.message||'The contract could not be started.');}
}
async function startContractForConversationProject(projectId,otherId){
  if(!me||me.role!=='client'){go('signin?role=client');return}
  try{
    if(!projectId||!otherId)throw new Error('This conversation is not linked to a project yet.');
    const existing=(await HunarData.contracts.list()).find(c=>String(c.project_id)===String(projectId)&&((String(c.client_id)===String(me.id)&&String(c.freelancer_id)===String(otherId))||(String(c.freelancer_id)===String(me.id)&&String(c.client_id)===String(otherId)))&&['offered','active'].includes(String(c.status||'').toLowerCase()));
    if(existing){go('contract/'+encodeURIComponent(existing.id));return}
    const apps=await HunarData.applications.forClient();
    const a=contractApplicationFor(projectId,otherId,apps)||contractApplicationFor(projectId,otherId,S.applications);
    if(!a)throw new Error('The hired application for this project could not be found.');
    const project=(S.projects||[]).find(p=>String(p.id)===String(projectId));let amount=contractAmountFromApplication(a,project);if(!amount&&supabaseClient){const raw=await supabaseClient.from('applications').select('proposed_price_etb,project_id,freelancer_id,status').eq('id',a.id).maybeSingle();if(!raw.error&&raw.data)amount=Number(raw.data.proposed_price_etb||0)}if(!amount)amount=Number(project?.budgetMax||project?.budgetMin||0);if(!amount)throw new Error('The hired proposal does not have a valid contract amount.');
    const id=await HunarData.contracts.create(a.id,project?.title||a.projectTitle||'HUNAR Project Contract','Contract for the agreed project work.',amount);
    await syncProductionData();go('contract/'+encodeURIComponent(id));
  }catch(err){console.error('HUNAR start contract from conversation:',err);alert(err?.message||'The contract could not be started.');}
}
async function fundHunarContract(contractId){
  if(!me||me.role!=='client'){go('signin?role=client');return}
  const btns=[...document.querySelectorAll('button')].filter(b=>/Fund Contract/i.test(b.textContent));
  btns.forEach(b=>{b.disabled=true;b.dataset.oldText=b.textContent;b.textContent='Starting payment…'});
  try{
    const result=await HunarData.contracts.fundContract(contractId);
    if(result?.checkout_url){window.location.href=result.checkout_url;return;}
    if(result?.already_paid){await syncProductionData();go('contract/'+encodeURIComponent(contractId));return;}
    throw new Error(result?.message||'Payment could not be started.');
  }catch(err){
    console.error('HUNAR fund contract:',err);
    alert(err?.message||'Payment could not be started. Please try again.');
    btns.forEach(b=>{b.disabled=false;b.textContent=b.dataset.oldText||'Fund Contract →'});
  }
}

function contractForConversation(projectId,otherId){
  const mine=String(me?.id||''),other=String(otherId||'');
  if(!mine||!other)return null;
  const rows=(S.contracts||[]).filter(c=>{
    const participants=(String(c.client_id)===mine&&String(c.freelancer_id)===other)||(String(c.freelancer_id)===mine&&String(c.client_id)===other);
    if(!participants)return false;
    return !projectId || !c.project_id || String(c.project_id)===String(projectId);
  });
  rows.sort((a,b)=>{
    const rank=c=>{const st=String(c.status||'').toLowerCase();return ['active','funded','working','submitted','in_review','approved','released','completed'].includes(st)?3:st==='offered'?2:1};
    const rr=rank(b)-rank(a);if(rr)return rr;
    return new Date(b.created_at||0)-new Date(a.created_at||0);
  });
  return rows[0]||null;
}

async function loadContractDetails(contractId){
  if(!supabaseClient||!me||!contractId)return null;
  try{
    const {data,error}=await supabaseClient.rpc('hunar_get_contract',{p_contract_id:contractId});
    if(error)throw error;
    const c=data||null;
    if(!c)return null;
    const {data:subs,error:subErr}=await supabaseClient.from('contract_submissions').select('id,contract_id,milestone_id,freelancer_id,note,created_at').eq('contract_id',contractId).order('created_at',{ascending:false});
    if(subErr)console.warn('HUNAR submission history:',subErr);
    const rows=Array.isArray(subs)?subs:[];
    const ids=rows.map(x=>x.id).filter(Boolean);
    let files=[];
    if(ids.length){const fr=await supabaseClient.from('contract_submission_files').select('id,submission_id,uploaded_by,storage_path,file_name,mime_type,file_size,created_at').in('submission_id',ids).order('created_at',{ascending:true});if(!fr.error)files=Array.isArray(fr.data)?fr.data:[];}
    const fileBySub=new Map(); for(const f of files){const k=String(f.submission_id);if(!fileBySub.has(k))fileBySub.set(k,[]);fileBySub.get(k).push(f)}
    const subByMilestone=new Map(); for(const x of rows){x.files=fileBySub.get(String(x.id))||[];const k=String(x.milestone_id);if(!subByMilestone.has(k))subByMilestone.set(k,[]);subByMilestone.get(k).push(x)}
    c.milestones=(Array.isArray(c.milestones)?c.milestones:[]).map(m=>({...m,submissions:subByMilestone.get(String(m.id))||[]}));
    S.contractDetails[String(contractId)]=c;
    return c;
  }catch(err){console.error('HUNAR contract detail:',err);return null;}
}
async function submitWorkForm(e,contractId,milestoneId){
  e.preventDefault();
  if(!me||me.role!=='freelancer')return;
  const form=e.target, note=String(form.elements.note?.value||'').trim(), selectedFile=form.elements.deliveryFile?.files?.[0]||null;
  const btn=form.querySelector('button[type="submit"]');
  if(!note){alert('Please add a short delivery note so the client knows what you completed.');return;}
  if(selectedFile&&selectedFile.size>50*1024*1024){alert('The delivery file must be 50 MB or smaller.');return;}
  if(selectedFile&&!['application/pdf','application/zip','text/plain','image/jpeg','image/png','image/webp','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document'].includes(selectedFile.type)){alert('Please upload a PDF, ZIP, image, TXT, DOC, or DOCX file.');return;}
  // Refresh live milestone state before every submission. This avoids a stale browser copy
  // producing the misleading "milestone is not ready" message.
  try{await loadContractDetails(contractId);}catch(_e){}
  const freshContract=S.contractDetails?.[String(contractId)]||null;
  const freshMilestone=freshContract?.milestones?.find(x=>String(x.id)===String(milestoneId));
  const freshStatus=String(freshMilestone?.status||'').toLowerCase();
  const freshCount=Array.isArray(freshMilestone?.submissions)?freshMilestone.submissions.length:0;
  if(freshStatus==='submitted'){
    window.hunarToast?.('✓ Work already submitted. It is waiting for the client to review.','info');
    go('contract/'+encodeURIComponent(contractId));
    return;
  }
  if(!['pending','in_progress','revision_requested'].includes(freshStatus)){
    window.hunarToast?.('This milestone is not ready for a new submission yet. Please check the current milestone status.','error');
    go('contract/'+encodeURIComponent(contractId));
    return;
  }
  if(btn){btn.disabled=true;btn.textContent='Saving submission…';}
  let submissionId=null, uploadPath=null;
  try{
    if(!supabaseClient)throw new Error('HUNAR connection is unavailable.');

    // Save the submission first. This prevents a slow file upload from leaving the
    // whole delivery stuck on "Submitting…".
    const rpc=await Promise.race([
      supabaseClient.rpc('hunar_create_contract_submission',{p_milestone_id:milestoneId,p_note:note}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('HUNAR took too long to save the submission. Please try again.')),30000))
    ]);
    if(rpc.error)throw rpc.error;
    submissionId=rpc.data;

    if(selectedFile){
      let file=selectedFile;
      // Phone screenshots/photos can be very large. Resize images before upload so
      // ordinary images finish quickly while keeping good delivery quality.
      if(file.type.startsWith('image/') && file.size>3*1024*1024){
        try{file=await optimizeDeliveryImage(file);}catch(optErr){console.warn('HUNAR image optimization skipped:',optErr);}
      }
      const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      uploadPath=me.id+'/'+contractId+'/'+milestoneId+'/'+crypto.randomUUID()+'-'+safe;
      if(btn)btn.textContent='Uploading file…';
      const up=await Promise.race([
        supabaseClient.storage.from('hunar-contract-submissions').upload(uploadPath,file,{upsert:false,contentType:file.type||'application/octet-stream'}),
        new Promise((_,reject)=>setTimeout(()=>reject(new Error('The file upload is taking too long. Your work was saved, but the file was not attached. Please try the attachment again with a smaller image.')),45000))
      ]);
      if(up.error)throw up.error;
      const ins=await Promise.race([
        supabaseClient.from('contract_submission_files').insert({submission_id:submissionId,uploaded_by:me.id,storage_path:uploadPath,file_name:selectedFile.name,mime_type:selectedFile.type||'application/octet-stream',file_size:selectedFile.size}),
        new Promise((_,reject)=>setTimeout(()=>reject(new Error('The delivery was saved, but HUNAR could not finish attaching the file. Please try again.')),30000))
      ]);
      if(ins.error)throw ins.error;
    }
    // The submission and optional file are now fully saved. Do not wait for a
    // full application-wide sync before leaving this page; that sync can take
    // several seconds and made the button appear stuck on the loading state.
    if(btn){btn.disabled=true;btn.textContent='Submitted ✓';}
    go('contract/'+encodeURIComponent(contractId)+'?submitted=1');
    setTimeout(()=>window.hunarToast?.('✓ Work submitted successfully. The client can now review your delivery.','success'),150);
    // Refresh cached contract data in the background after navigation.
    Promise.allSettled([syncProductionData(),loadContractDetails(contractId)]).catch(()=>{});
  }catch(err){
    if(uploadPath){try{await supabaseClient.storage.from('hunar-contract-submissions').remove([uploadPath]);}catch(cleanErr){console.warn('HUNAR delivery cleanup:',cleanErr)}}
    console.error('HUNAR submit work:',err);
    if(submissionId && selectedFile && /too long|could not finish attaching|file upload/i.test(String(err?.message||''))){
      alert('Your work submission was saved successfully. The image/file upload did not finish. Please reopen Submit Work and attach a smaller file.');
      try{await syncProductionData();await loadContractDetails(contractId);}catch(_e){}
      go('contract/'+encodeURIComponent(contractId));
      return;
    }
    alert(err?.message||'The work could not be submitted.');
    if(btn){btn.disabled=false;btn.textContent='Submit Work →';}
  }
}
async function optimizeDeliveryImage(file){
  return await new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{try{
      const max=2200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{URL.revokeObjectURL(url);if(!blob)return reject(new Error('Could not optimize image'));resolve(new File([blob],file.name.replace(/\.[^.]+$/i,'.webp'),{type:'image/webp',lastModified:Date.now()}));},'image/webp',.82);
    }catch(err){URL.revokeObjectURL(url);reject(err)}};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read image'))};img.src=url;
  });
}
function submissionFileLabel(file){const size=Number(file?.file_size||0);const pretty=size>=1048576?(size/1048576).toFixed(1)+' MB':size>=1024?(size/1024).toFixed(0)+' KB':size+' B';return esc(file?.file_name||'Delivery file')+' · '+pretty;}
async function openSubmissionFile(path,name){
  // Private contract files are opened through the authenticated Supabase client.
  // Downloading first avoids browser issues with signed private URLs and lets
  // the client view the exact stored object without exposing the bucket.
  const target=window.open('about:blank','_blank');
  try{
    if(!supabaseClient)throw new Error('HUNAR is not connected. Please refresh and try again.');
    const storage=supabaseClient.storage.from('hunar-contract-submissions');
    const downloaded=await storage.download(path);
    if(!downloaded.error&&downloaded.data){
      const blobUrl=URL.createObjectURL(downloaded.data);
      if(target)target.location.href=blobUrl;
      else window.location.href=blobUrl;
      setTimeout(()=>URL.revokeObjectURL(blobUrl),120000);
      return;
    }
    // Fallback: generate a fresh authenticated signed URL if download failed.
    const signed=await storage.createSignedUrl(path,3600);
    if(!signed.error&&signed.data?.signedUrl){
      if(target)target.location.href=signed.data.signedUrl;
      else window.location.href=signed.data.signedUrl;
      return;
    }
    throw downloaded.error||signed.error||new Error('The stored delivery file could not be opened.');
  }catch(err){
    if(target)target.close();
    console.error('HUNAR delivery file open:',err);
    if(window.hunarToast)window.hunarToast('The delivery file could not be opened. Please try again.','error');
    else alert('The delivery file could not be opened. Please try again.');
  }
}

async function loadContractSubmissionReview(contractId,milestoneId){
