  const favorites=getMessageFavorites();
  const isConversationUnread=c=>c.msgs.some(m=>String(m.to)===String(me.id)&&!messageSeen(c.id,m.at));
  const unreadConvs=convs.filter(isConversationUnread);
  const favoriteConvs=convs.filter(c=>favorites.has(c.id));
  const visibleConvs=messageFilter==='unread'?unreadConvs:messageFilter==='favorites'?favoriteConvs:convs;
  const latestIncoming=all.filter(m=>String(m.to)===String(me.id)).sort((a,b)=>new Date(b.at||0)-new Date(a.at||0))[0];
  // If a specific conversation was requested, it ALWAYS wins.
  // Do not fall back to another conversation with the same freelancer.
  let active=requestedConversationId?convs.find(c=>c.id===requestedConversationId):null;
  if(requestedConversationId&&!active&&requestedWithId){
    // A brand-new conversation has no message rows yet, so it is absent from `convs`.
    // Keep the exact conversation ID and participant instead of opening an older thread.
    active={id:requestedConversationId,msgs:[],latest:null,other:requestedWithId,projectId:requestedProjectId||null};
  }
  if(!requestedConversationId){
    if(requestedProjectId)active=convs.find(c=>String(c.projectId||'')===requestedProjectId&&(requestedWithId?c.other===requestedWithId:true));
    if(!active&&requestedWithId)active=convs.find(c=>c.other===requestedWithId);
    if(!active&&latestIncoming)active=convs.find(c=>c.id===String(latestIncoming.conversationId));
  }
  const withId=active?.other||requestedWithId||'';
  // A client can open an applicant's profile from Applications before a conversation
  // exists. Keep that requested freelancer open in Message Center; the first Send
  // action will create the real conversation through the existing messaging service.
  const requestedTarget=withId?publicTarget(withId):null;
  const thread=active?active.msgs:(withId?all.filter(m=>otherFor(m)===withId).sort((a,b)=>new Date(a.at||0)-new Date(b.at||0)):[]);
  const otherName=withId?nameOf(withId):'Choose a conversation';
  const targetRole=withId?roleOf(withId):'';
  const canMessage=!!withId&&!!targetRole&&targetRole!==me.role;
  const projectId=active?.projectId||thread.find(x=>x.projectId)?.projectId||null;
  const project=projectId?(S.projects||[]).find(x=>String(x.id)===String(projectId)):null;
  const linkedContract=projectId?contractForConversation(projectId,withId):null;
  // Also find a contract by the two participants so the contract controls still
  // appear when an older conversation has no project_id attached.
  const participantContract=linkedContract||contractForConversation(null,withId);
  const projectIsHired=!!projectId&&!!withId&&!!project&&String(project.developer||'')===String(withId)&&String(project.client||'')===String(me.id);
  const contractApplication=participantContract?null:(S.applications||[]).find(a=>String(a.uid??a.freelancer_id??a.freelancerId)===String(withId)&&String(a.status||'').toLowerCase()==='accepted'&&(!projectId||String(a.projectId??a.project_id)===String(projectId)));
  const canStartContract=me.role==='client'&&!!contractApplication&&!participantContract;
  const participantContractStatus=String(participantContract?.status||'').toLowerCase();
  // Only contracts that are currently being worked on/in process should show Open Contract.
  // Approved, released, and completed contracts are finished and must show Create Contract
  // for a future/new project instead of reopening the finished agreement from this bar.
  const contractIsOpen=['active','funded','working','submitted','in_review'].includes(participantContractStatus);
  const contractBar=withId?`<div class="conversationContractBar"><div><b>${contractIsOpen?'Contract Started':participantContract?'Contract Offer':'Contract Center'}</b><div class="muted">${participantContract?esc(participantContract.title||'Contract'):'Create the contract connected to this conversation.'}</div></div><div class="contractActions">${contractIsOpen?`<button class="msgAction createContract" type="button" onclick="openContractFromConversation('${esc(participantContract.id)}')">Open Contract</button>`:`<button class="msgAction createContract" type="button" onclick="createContractFromConversation('${esc(projectId||'')}','${esc(withId)}','${esc(active?.id||'')}')">Create Contract</button>`}${participantContract&&me.role==='freelancer'&&participantContractStatus==='offered'?`<button class="msgAction" type="button" onclick="acceptConversationContract('${esc(participantContract.id)}')">Accept & Start</button>`:''}</div></div>`:'';
  const sentCount=thread.filter(m=>String(m.from)===String(me.id)).length,receivedCount=thread.filter(m=>String(m.to)===String(me.id)).length;
  const fmtTime=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};
  const convUrl=(c)=>'messages?conversation='+encodeURIComponent(c.id)+'&with='+encodeURIComponent(c.other)+(c.projectId?'&project='+encodeURIComponent(c.projectId):'');
  const contactButton=withId&&canMessage?`<button class="msgAction replyAction" type="button" onclick="document.querySelector('.threadComposer textarea')?.focus()">Reply</button><button class="msgAction" type="button" onclick="openHunarMeet('${encodeURIComponent(withId)}')">▣ Video Meet</button>`:'';
  if(active?.id)setTimeout(()=>markConversationSeen(active.id),0);
  return `<section class="section pageEnter messagesPage"><div class="container">
    <div class="messagesTopbar"><div><span class="tag">MESSAGE CENTER</span><h1>Messages</h1><p class="sectionLead">Keep conversations, project context, and replies together in one professional workspace.</p></div><div class="messagesTopActions"><button class="btn outline" type="button" onclick="go('support-chat')">HUNAR Support</button><button class="btn primary" type="button" onclick="go('new-message')">+ New Message</button></div></div>
    <div class="messagesWorkspace">
      <aside class="messagesInbox card"><div class="inboxHead"><div><b>Inbox</b><span class="inboxLive"><i></i> Live</span><span class="muted"> ${convs.length} conversation${convs.length===1?'':'s'}</span></div><button class="iconBtn" type="button" onclick="go('messages')" aria-label="Refresh conversations">↻</button></div>
      <div class="inboxTabs" role="tablist" aria-label="Conversation filters"><button class="${messageFilter==='all'?'active':''}" type="button" onclick="setMessageFilter('all')">All <span class="filterCount">${convs.length}</span></button><button class="${messageFilter==='unread'?'active':''}" type="button" onclick="setMessageFilter('unread')">Unread <span class="filterCount">${unreadConvs.length}</span></button><button class="${messageFilter==='favorites'?'active':''}" type="button" onclick="setMessageFilter('favorites')">Favorites <span class="filterCount">${favoriteConvs.length}</span></button></div>
      <label class="messageSearch"><span>⌕</span><input id="messageSearchInput" type="search" placeholder="Search conversations" oninput="filterMessageList(this.value)"></label>
      <div id="messageConversationList" class="conversationList">${visibleConvs.map(c=>{const nm=nameOf(c.other),m=c.latest,unread=isConversationUnread(c),fav=favorites.has(c.id);const preview=String(m.text||m.body||'').replace(/^\[HUNAR_VOICE\].*$/,'🎙 Voice message');return `<div class="conversationRowWrap"><button class="conversationRow ${active?.id===c.id?'selected':''} ${unread?'unread':''}" type="button" data-name="${esc(nm.toLowerCase())}" onclick="openMessageConversation('${esc(c.id)}','${esc(c.other)}','${esc(c.projectId||'')}')"><div class="messageAvatar">${esc(initials(nm))}</div><div class="conversationCopy"><div class="conversationName"><b>${esc(nm)}</b><small>${esc(fmtTime(m.at))}</small></div><p>${esc(preview.slice(0,74))}${preview.length>74?'…':''}</p></div>${unread?'<i class="conversationUnreadDot" aria-label="Unread"></i>':''}</button><button class="conversationStar ${fav?'favorite':''}" type="button" aria-label="${fav?'Remove from favorites':'Add to favorites'}" title="${fav?'Remove from favorites':'Add to favorites'}" onclick="toggleMessageFavorite(event,'${esc(c.id)}')">${fav?'★':'☆'}</button></div>`}).join('')||`<div class="messageEmpty"><b>${messageFilter==='unread'?'No unread conversations.':messageFilter==='favorites'?'No favorite conversations yet.':'Your inbox is empty.'}</b><span>${messageFilter==='favorites'?'Tap ☆ on any conversation to save it here.':'Start a professional conversation with a HUNAR member.'}</span></div>`}</div></aside>
      <main class="messageConversation card">
        ${withId?`<div class="conversationHeader"><div class="conversationPerson"><div class="messageAvatar large">${esc(initials(otherName))}</div><div><span class="eyebrowSmall">DIRECT CONVERSATION</span><h2>${esc(otherName)}</h2><span class="muted">${esc(targetRole==='freelancer'?'Freelancer':'Client')} · Professional communication</span></div></div><div class="conversationHeaderActions">${contactButton}<button class="iconBtn" type="button" onclick="go('messages')" aria-label="Close conversation">×</button></div></div>${contractBar}<div class="conversationBody">${thread.map(m=>{const body=String(m.text||m.body||'');const voice=body.startsWith('[HUNAR_VOICE]');const voicePath=voice?body.replace(/^\[HUNAR_VOICE\]\s*/,''):'';return `<div class="msgRow ${String(m.from)===String(me.id)?'outgoing':'incoming'}"><div class="threadBubble">${voice?`<div class="voiceBubble"><span class="voiceBubbleLabel">🎙 Voice message</span><audio controls preload="none" data-voice-path="${esc(voicePath)}" onplay="resolveVoiceAudio(this)"></audio></div>`:`<p>${esc(body)}</p>`}<small>${esc(fmtTime(m.at))}</small></div></div>`}).join('')||'<div class="threadNoMessages">No messages in this conversation yet.</div>'}</div>${canMessage?`<form class="threadComposer" onsubmit="sendNewMessage(event)"><input type="hidden" name="to" value="${esc(withId)}"><input type="hidden" name="conversation" value="${esc(active?.id||'')}"><input type="hidden" name="project" value="${esc(projectId||'')}"><div id="voicePreview" class="voicePreview" style="display:none"></div><div class="messageMediaBar"><button class="mediaTool video" type="button" onclick="openHunarMeet('${encodeURIComponent(withId)}')">▣ <span>Video Meet</span></button><button id="voiceRecordBtn" class="mediaTool" type="button" onclick="toggleVoiceRecord('${encodeURIComponent(withId)}')">● <span>Voice</span></button><textarea name="body" minlength="2" maxlength="4000" placeholder="Write a message…"></textarea><button class="btn primary" type="submit">Send</button></div><div class="composerBottom"><span class="muted">Message, voice note, or live meeting - all in this conversation.</span><span id="voiceTimer" class="voiceTimer">0:00</span></div><div id="newMessageStatus" class="notice">${sentCount+receivedCount} message${sentCount+receivedCount===1?'':'s'} in this conversation.</div></form>`:`<div class="threadComposer"><div class="notice">Messaging is available between clients and freelancers. ${me.role==='freelancer'&&targetRole==='freelancer'?'Freelancer-to-freelancer messaging is not available.':'This conversation is read-only.'}</div></div>`}`:`<div class="messageWelcome"><div class="welcomeOrb"><span>H</span></div><span class="eyebrowSmall">HUNAR MESSAGE CENTER</span><h2>Your conversations</h2><p class="muted">Select a conversation from the inbox to continue where you left off.</p><button class="btn primary" type="button" onclick="go('new-message')">Start a Conversation</button></div>`}
      </main>
      <aside class="messageDetails card">${withId?`<div class="detailsKicker">CONVERSATION DETAILS</div><div class="detailsPerson"><div class="messageAvatar large">${esc(initials(otherName))}</div><h3>${esc(otherName)}</h3><span class="muted">${esc(targetRole==='freelancer'?'Freelancer':'Client')}</span></div><div class="detailsRule"></div><div class="detailStat"><span>Messages</span><b>${thread.length}</b></div><div class="detailStat"><span>Your messages</span><b>${sentCount}</b></div><div class="detailStat"><span>Received</span><b>${receivedCount}</b></div>${project?`<div class="detailsRule"></div><div class="detailsKicker">PROJECT CONTEXT</div><div class="projectContext"><b>${esc(project.title||'Project')}</b><span>${esc(project.category||'HUNAR Project')}</span><small>${esc(project.status||'Open')}</small><button class="btn outline" type="button" onclick="go('project/${esc(project.id)}')">View Project</button></div>`:''}<div class="detailsRule"></div><div class="messagesFutureStrip"><div class="messagesFutureIcon">✦</div><div><b>HUNAR communication hub</b><span>More project tools can stay connected here as your work grows.</span></div></div><div class="detailsSafety"><b>Stay safe on HUNAR</b><span>Keep project communication here. Never share your password, email OTP, or other security codes.</span></div>`:`<div class="detailsEmpty"><span class="eyebrowSmall">DETAILS</span><h3>Conversation details</h3><p class="muted">Select a conversation to see the participant, message count, and project context.</p></div>`}</aside>
    </div></div></section>`
}

let hunarVoiceRecorder=null;let hunarVoiceChunks=[];let hunarVoiceStartedAt=0;let hunarVoiceTimer=null;let hunarVoiceBlob=null;let hunarVoiceUrl=null;let hunarMessagePoll=null;
function openHunarMeet(encodedWithId){
 const withId=decodeURIComponent(String(encodedWithId||''));if(!withId||!me)return;
 let overlay=document.getElementById('hunarMeetOverlay');
 if(!overlay){overlay=document.createElement('div');overlay.id='hunarMeetOverlay';overlay.className='meetOverlay';overlay.innerHTML='<div class="meetPanel"><div class="meetHead"><div><strong>HUNAR Video Meet</strong><small>Live meeting inside this conversation</small></div><button class="meetClose" type="button" onclick="closeHunarMeet()" aria-label="Close video meeting">×</button></div><iframe id="hunarMeetFrame" class="meetFrame" allow="camera; microphone; fullscreen; display-capture; autoplay" referrerpolicy="no-referrer"></iframe><div class="meetHint">Your camera and microphone stay controlled by your browser. Both participants should use Video Meet from this conversation.</div></div>';document.body.appendChild(overlay);}
 const ids=[String(me.id),String(withId)].sort();const room='HUNAR-'+ids.join('-');const safeRoom=room.replace(/[^a-zA-Z0-9_-]/g,'').slice(0,90);const frame=document.getElementById('hunarMeetFrame');if(frame)frame.src='https://meet.jit.si/'+encodeURIComponent(safeRoom);overlay.classList.add('open');document.body.style.overflow='hidden';
}
function closeHunarMeet(){const o=document.getElementById('hunarMeetOverlay');if(o)o.classList.remove('open');const f=document.getElementById('hunarMeetFrame');if(f)f.src='about:blank';document.body.style.overflow=''}
async function toggleVoiceRecord(encodedWithId){
 const btn=document.getElementById('voiceRecordBtn'),timer=document.getElementById('voiceTimer'),preview=document.getElementById('voicePreview');
 if(hunarVoiceRecorder&&hunarVoiceRecorder.state==='recording'){hunarVoiceRecorder.stop();return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){if(preview){preview.style.display='block';preview.innerHTML='<span class="muted">Voice recording is not supported by this browser.</span>'}return}
 try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});hunarVoiceChunks=[];hunarVoiceStartedAt=Date.now();
   const preferred=['audio/webm;codecs=opus','audio/webm','audio/mp4'];let mime=preferred.find(x=>window.MediaRecorder.isTypeSupported?.(x))||'';hunarVoiceRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
   hunarVoiceRecorder.ondataavailable=e=>{if(e.data.size)hunarVoiceChunks.push(e.data)};
   hunarVoiceRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const type=hunarVoiceRecorder.mimeType||'audio/webm';hunarVoiceBlob=new Blob(hunarVoiceChunks,{type});if(hunarVoiceUrl)URL.revokeObjectURL(hunarVoiceUrl);hunarVoiceUrl=URL.createObjectURL(hunarVoiceBlob);if(preview){preview.style.display='flex';preview.innerHTML='<span class="voiceTimer">✓ Ready</span><audio controls src="'+hunarVoiceUrl+'"></audio><button class="iconBtn" type="button" onclick="clearVoiceNote()" aria-label="Remove voice note">×</button>'}if(btn){btn.classList.remove('recording');btn.innerHTML='● <span>Voice</span>'}if(timer)timer.textContent='0:00';clearInterval(hunarVoiceTimer)};
   hunarVoiceRecorder.start();if(btn){btn.classList.add('recording');btn.innerHTML='■ <span>Stop</span>'}hunarVoiceTimer=setInterval(()=>{if(timer){const sec=Math.floor((Date.now()-hunarVoiceStartedAt)/1000);timer.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}},250);
 }catch(err){console.warn('HUNAR voice recording',err);if(preview){preview.style.display='block';preview.innerHTML='<span class="muted">Microphone permission was not granted. Allow microphone access and try again.</span>'}}
}
function clearVoiceNote(){hunarVoiceBlob=null;if(hunarVoiceUrl){URL.revokeObjectURL(hunarVoiceUrl);hunarVoiceUrl=null}const p=document.getElementById('voicePreview');if(p){p.style.display='none';p.innerHTML=''}const t=document.getElementById('voiceTimer');if(t)t.textContent='0:00'}
async function resolveVoiceAudio(audio){const path=audio?.dataset?.voicePath;if(!path||audio.dataset.resolved==='1')return;try{const url=await HunarData.messaging.voiceUrl(path);audio.src=url;audio.dataset.resolved='1'}catch(err){audio.outerHTML='<span class="muted">Voice message unavailable.</span>'}}
function preloadVoiceMessages(){setTimeout(()=>{document.querySelectorAll('.voiceBubble audio[data-voice-path]').forEach(a=>resolveVoiceAudio(a))},0)}

function getMessageFavorites(){try{const raw=JSON.parse(localStorage.getItem('hunar_message_favorites_'+String(me?.id||''))||'[]');return new Set(Array.isArray(raw)?raw.map(String):[])}catch(e){return new Set()}}
function saveMessageFavorites(set){try{localStorage.setItem('hunar_message_favorites_'+String(me?.id||''),JSON.stringify([...set]))}catch(e){}}
function getMessageSeen(){try{const raw=JSON.parse(localStorage.getItem('hunar_message_seen_'+String(me?.id||''))||'{}');return raw&&typeof raw==='object'?raw:{}}catch(e){return {}}}
function messageSeen(conversationId,at){const seen=getMessageSeen()[String(conversationId)];if(!seen)return false;const a=new Date(at||0).getTime(),b=new Date(seen).getTime();return !isNaN(a)&&!isNaN(b)&&a<=b}
function markConversationSeen(conversationId){if(!conversationId||!me)return;const seen=getMessageSeen();seen[String(conversationId)]=new Date().toISOString();try{localStorage.setItem('hunar_message_seen_'+String(me.id),JSON.stringify(seen))}catch(e){}}
function openMessageConversation(conversationId,otherId,projectId){markConversationSeen(conversationId);let url='messages?conversation='+encodeURIComponent(conversationId)+'&with='+encodeURIComponent(otherId);if(projectId)url+='&project='+encodeURIComponent(projectId);go(url)}
function toggleMessageFavorite(event,conversationId){event?.stopPropagation();const set=getMessageFavorites();const id=String(conversationId);if(set.has(id))set.delete(id);else set.add(id);saveMessageFavorites(set);refreshMessagesInPlace({preserveScroll:true})}
function setMessageFilter(filter){window.hunarMessageFilter=filter||'all';refreshMessagesInPlace({preserveScroll:true})}
function filterMessageList(value){const q=String(value||'').trim().toLowerCase();document.querySelectorAll('#messageConversationList .conversationRowWrap').forEach(wrap=>{const row=wrap.querySelector('.conversationRow');wrap.style.display=!q||String(row?.dataset.name||'').includes(q)?'grid':'none'})}

function profileEdit(){if(!me){go('signin');return ''}let d=currentProfile();return `<section class="section"><div class="container narrow"><div class="authHead"><span class="tag">EDIT PROFILE</span><h1>Keep your profile up to date.</h1></div><form class="card" onsubmit="saveProfileEdit(event)"><div class="two"><div class="field"><label>Name</label><input name="name" required value="${esc(d.n||'')}"></div><div class="field"><label>Professional title</label><input name="title" value="${esc(d.t||'')}"></div><div class="field"><label>City</label><input name="city" value="${esc(d.city||d.l||'')}"></div><div class="field"><label>Region</label><input name="region" value="${esc(d.r||'')}"></div><div class="field"><label>Languages</label><input name="languages" value="${esc((d.languages||[]).join(', '))}"></div><div class="field"><label>Starting price ETB</label><input name="price" type="number" value="${esc(d.price||'')}"></div><div class="field"><label>Profile photo</label><input type="file" name="photoFile" accept="image/*" onchange="editPhotoUpload(event)"></div></div><div class="field"><label>Certificates</label><input name="certificates" required value="${esc((d.certificates||[]).join(', '))}"></div><div class="field"><label>Professional description</label><textarea name="bio" required>${esc(d.bio||'')}</textarea></div><button class="btn primary">Save Changes</button><button type="button" class="btn outline" onclick="go('profile')">Cancel</button></form></div></section>`}

function editPhotoUpload(e){const file=e.target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){alert('Use a JPG, PNG, or WebP image up to 5 MB.');e.target.value='';return}window.hunarPendingProfilePhoto=file;let input=document.querySelector('input[name=photo]');if(input)input.value='';}

async function saveProfileEdit(e){e.preventDefault();if(!productionUser){alert('Please sign in with a real Hunar account.');return}let f=new FormData(e.target);try{let photoUrl=null;const photoFile=e.target.querySelector('input[name=photoFile]')?.files?.[0];if(photoFile){const path=me.id+'/'+crypto.randomUUID()+'.'+photoFile.name.split('.').pop().toLowerCase();const uploaded=await HunarData.storage.upload('hunar-avatars',path,photoFile);photoUrl=uploaded.publicUrl||photoUrl;}await HunarData.accounts.update({full_name:String(f.get('name')||'').trim(),city:String(f.get('city')||'').trim(),region:String(f.get('region')||'').trim(),photo_url:photoUrl,bio:String(f.get('bio')||'').trim()});if(me.role==='freelancer')await HunarData.freelancers.updateProfile({professional_title:String(f.get('title')||'').trim(),starting_price_etb:Number(f.get('price')||0),languages:String(f.get('languages')||'').split(',').map(x=>x.trim()).filter(Boolean),certificates:String(f.get('certificates')||'').split(',').map(x=>x.trim()).filter(Boolean)});await syncProductionData();go('profile')}catch(err){alert(err.message)}}

function portfolioForm(existing){let p=existing||{};return `<section class="section"><div class="container narrow"><div class="authHead"><span class="tag">${existing?'EDIT PORTFOLIO':'NEW PORTFOLIO PROJECT'}</span><h1>${existing?'Edit your project.':'Add a project to your portfolio.'}</h1><p class="muted">Clients should be able to understand the work, your role, and the tools you used.</p></div><form class="card" onsubmit="savePortfolio(event,'${esc(existing?.id||'')}')"><div class="field"><label>Project title</label><input name="title" required value="${esc(p.title||'')}"></div><div class="field"><label>Description</label><textarea name="description" required>${esc(p.description||'')}</textarea></div><div class="two"><div class="field"><label>Category</label><select name="category">${S.categories.map(c=>`<option ${p.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Tools used</label><input name="tools" required value="${esc((p.tools||[]).join(', '))}"></div><div class="field"><label>Your role</label><input name="role" value="${esc(p.role||'')}"></div><div class="field"><label>Year</label><input name="year" value="${esc(p.year||new Date().getFullYear())}"></div></div><div class="field"><label>Live project link</label><input name="url" value="${esc(p.url||'')}"></div><div class="field"><label>Project image / screenshot</label><input type="file" name="imageFile" accept="image/*" onchange="portfolioImageUpload(event)"><small class="muted">Upload only an image you own or are authorized to display.</small></div><div class="actions"><button class="btn primary">Save Project</button><button type="button" class="btn outline" onclick="go('profile')">Cancel</button></div></form></div></section>`}

 return `<section class="identityPage pageEnter"><div class="identityShell">

   </div>

function identityPreviewFile(inputId,previewId,nameId){const input=document.getElementById(inputId),preview=document.getElementById(previewId),name=document.getElementById(nameId);if(!input||!preview)return;input.addEventListener('change',()=>{const file=input.files?.[0];if(name)name.textContent=file?file.name:'';if(!file){preview.textContent='Preview';return}if(!['image/jpeg','image/png'].includes(file.type)||file.size>10*1024*1024){preview.textContent='JPG/PNG up to 10 MB';return}const url=URL.createObjectURL(file);preview.innerHTML=`<img src="${url}" alt="Upload preview">`;});}

let hunarIdentityCameraStream=null;function startIdentityCamera(){const video=document.getElementById('identityCameraVideo');if(!video||!navigator.mediaDevices?.getUserMedia){alert('Camera access is not available in this browser. Please upload a selfie photo instead.');return}navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(stream=>{hunarIdentityCameraStream=stream;video.srcObject=stream}).catch(err=>{console.error('HUNAR identity camera:',err);alert('Camera access was not allowed. Please upload a selfie photo instead.')})}function stopIdentityCamera(){if(hunarIdentityCameraStream){hunarIdentityCameraStream.getTracks().forEach(t=>t.stop());hunarIdentityCameraStream=null}const video=document.getElementById('identityCameraVideo');if(video)video.srcObject=null}function captureIdentitySelfie(){const video=document.getElementById('identityCameraVideo'),preview=document.getElementById('identitySelfiePreview'),empty=document.getElementById('identityCameraEmpty');if(!video||!video.videoWidth){alert('Open the camera first, then take the selfie.');return}const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.toBlob(blob=>{if(!blob)return;window.hunarPendingIdentitySelfie=new File([blob],'hunar-selfie.jpg',{type:'image/jpeg'});if(preview){preview.src=URL.createObjectURL(blob);preview.style.display='block'}if(empty)empty.style.display='none';stopIdentityCamera()},'image/jpeg',.9)}
async function submitIdentityVerification(e){
 e.preventDefault();
 if(!me||!productionUser){go('signin');return}
 const f=new FormData(e.target),statusEl=document.getElementById('identityStatus'),front=f.get('idFront'),back=f.get('idBack'),selfie=f.get('selfie');
 if(!front||!front.size||!back||!back.size||!selfie||!selfie.size){if(statusEl)statusEl.querySelector('.notice').textContent='Please upload your selfie, ID front, and ID back.';return}
 const files=[front,back,selfie];
 if(files.some(x=>x.size>10*1024*1024)){if(statusEl)statusEl.querySelector('.notice').textContent='Each verification file must be 10 MB or smaller.';return}
 if(files.some(x=>!['image/jpeg','image/png'].includes(x.type))){if(statusEl)statusEl.querySelector('.notice').textContent='Use JPG or PNG images for the selfie and ID sides.';return}
 const button=e.target.querySelector('button[type="submit"]');if(button)button.disabled=true;
 try{
   const legalName=String(f.get('legalName')||'').trim(),idType=String(f.get('idType')||'').trim();
   const req=await HunarData.verification.submit({legalName,idType});
   await HunarData.verification.attachFiles(req.id,front,selfie,back);
   await syncProductionData();
   go('identity-verification');
 }catch(err){console.error('HUNAR identity verification:',err);if(statusEl)statusEl.querySelector('.notice').textContent=err.message||'Identity verification could not be submitted. Please try again.';if(button)button.disabled=false;}
}

sals or promise work you cannot deliver.</li><li>Keep scope, deliverables, timeline, price, and revisions clear.</li><li>Do not spam applications or intentionally submit irrelevant proposals.</li></ul></article><article class="policyCard" id="messages-policy"><span class="panelKicker">04 · MESSAGING</span><h2>Messaging & Contact Information</h2><ul><li>Keep HUNAR conversations focused on professional work.</li><li>Do not share or request personal phone numbers, personal email addresses, social handles, home addresses, or instructions designed to move communication outside HUNAR.</li><li>Never send passwords, OTP codes, authentication links, or private security information.</li><li>Messages may be blocked when they contain prohibited contact information.</li></ul></article><article class="policyCard" id="identity"><span class="panelKicker">05 · IDENTITY</span><h2>Identity Verification Policy</h2><ul><li>Identity verification is separate from email verification.</li><li>Provide only genuine government-issued identity information requested by HUNAR's verification process.</li><li>Do not upload another person's identity document or selfie.</li><li>Verification may be reviewed by authorized HUNAR administrators and may remain pending until reviewed.</li></ul></article><article class="policyCard" id="privacy"><span class="panelKicker">06 · PRIVACY</span><h2>Privacy & Personal Information</h2><ul><li>Only provide information needed for the HUNAR feature you are using.</li><li>Do not publish another person's private information without permission.</li><li>Do not request unnecessary sensitive information from another member.</li><li>Use privacy-conscious language when discussing clients, freelancers, and projects.</li></ul></article><article class="policyCard" id="content"><span class="panelKicker">07 · CONTENT</span><h2>Content & Portfolio Policy</h2><ul><li>Upload work you own or are authorized to show.</li><li>Do not upload malware, deceptive files, stolen content, or unlawful material.</li><li>Portfolio descriptions must accurately represent your work and experience.</li><li>Do not use fake reviews, fake credentials, or fabricated project results.</li></ul></article><article class="policyCard" id="security"><span class="panelKicker">08 · SECURITY</span><h2>Account Security Policy</h2><ul><li>Keep your password private and use a strong password.</li><li>Never give an OTP to another person, including someone claiming to be support.</li><li>Report suspicious account activity as soon as possible.</li><li>Do not attempt to bypass authentication, authorization, rate limits, or security controls.</li></ul></article><article class="policyCard" id="reviews"><span class="panelKicker">09 · REVIEWS</span><h2>Reviews & Reputation</h2><ul><li>Reviews should reflect a genuine work experience.</li><li>No paid, fake, retaliatory, or coordinated reviews.</li><li>Do not threaten another member to obtain a positive review.</li><li>Keep review content factual, relevant, and professional.</li></ul></article><article class="policyCard" id="payments"><span class="panelKicker">10 · PAYMENTS</span><h2>Commercial & Payment Conduct</h2><ul><li>Do not use HUNAR to request or facilitate fraudulent payments.</li><li>Do not misrepresent prices, deliverables, refunds, or commercial terms.</li><li>Keep payment-related agreements clear before work begins.</li><li>Do not pressure another member to reveal payment credentials or authentication information.</li></ul></article><article class="policyCard" id="enforcement"><span class="panelKicker">11 · ENFORCEMENT</span><h2>Reporting & Enforcement</h2><ul><li>HUNAR may review reports and relevant activity to protect users and the platform.</li><li>Violations may result in warnings, message blocking, feature restrictions, suspension, or account action.</li><li>Serious or repeated violations may receive stronger action.</li><li>When reporting an issue, provide the relevant page, account context, and evidence without sharing function earningsRowsForPeriod(period){
 const rows=(Array.isArray(S.contractTransactions)?S.contractTransactions:[]).filter(x=>Number(x.freelancer_amount_etb||0)>0&&x.created_at);
 const now=new Date();
 const start=new Date(now);
 const cfg={};
 if(period==='1d'){start.setHours(now.getHours()-23,0,0,0);cfg.count=24;cfg.unit='hour';}
 else if(period==='7d'){start.setHours(0,0,0,0);start.setDate(start.getDate()-6);cfg.count=7;cfg.unit='day';}
 else if(period==='1m'){start.setHours(0,0,0,0);start.setDate(start.getDate()-29);cfg.count=30;cfg.unit='day';}
 else if(period==='7m'){start.setHours(0,0,0,0);start.setMonth(start.getMonth()-6);start.setDate(1);cfg.count=7;cfg.unit='month';}
 else {start.setHours(0,0,0,0);start.setMonth(start.getMonth()-11);start.setDate(1);cfg.count=12;cfg.unit='month';}
 const buckets=[];
 for(let i=0;i<cfg.count;i++){
   const d=new Date(start);
   if(cfg.unit==='hour')d.setHours(start.getHours()+i);
   else if(cfg.unit==='day')d.setDate(start.getDate()+i);
   else d.setMonth(start.getMonth()+i);
   buckets.push({date:d,value:0});
 }
 rows.forEach(row=>{
   const d=new Date(row.created_at); if(isNaN(d)||d<start)return;
   let idx;
   if(cfg.unit==='hour')idx=Math.floor((d-start)/3600000);
   else if(cfg.unit==='day')idx=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);
   else idx=(d.getFullYear()-start.getFullYear())*12+(d.getMonth()-start.getMonth());
   if(idx>=0&&idx<buckets.length)buckets[idx].value+=Number(row.freelancer_amount_etb||0);
 });
 return buckets;
}
function formatEarningsBucket(d,unit){
 if(unit==='hour')return d.toLocaleTimeString([],{hour:'numeric'});
 if(unit==='month')return d.toLocaleDateString([],{month:'short',year:'2-digit'});
 return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function setEarningsPeriod(period,button){
 const graph=button?.closest('.earningsOverviewGraph'); if(!graph)return;
 graph.dataset.period=period;
 graph.querySelectorAll('.earningsPeriods button').forEach(b=>b.classList.toggle('active',b.dataset.period===period));
 const unit=period==='1d'?'hour':(period==='7m'||period==='1y'?'month':'day');
 const buckets=earningsRowsForPeriod(period);
 const max=Math.max(1,...buckets.map(x=>x.value));
 const total=buckets.reduce((s,x)=>s+x.value,0);
 const nonZero=buckets.filter(x=>x.value>0).length;
 const label=period==='1d'?'Last 24 hours':period==='7d'?'Last 7 days':period==='1m'?'Last 30 days':period==='7m'?'Last 7 months':'Last 12 months';
 const every=period==='1d'?3:period==='1m'?3:1;
 graph.querySelector('.earningsChartArea').innerHTML=`<div class="earningsChartMeta"><span>${label}</span><b>${money(total)}</b><small>${nonZero} period${nonZero===1?'':'s'} with recorded earnings</small></div><div class="earningsChart">${buckets.map((x,i)=>`<div class="earningsBarCol" title="${esc(formatEarningsBucket(x.date,unit))}: ${money(x.value)}"><span class="earningsBarValue">${x.value?money(x.value):''}</span><i class="earningsBar" style="--h:${x.value?Math.max(5,Math.round(x.value/max*100)):3}%"></i><small>${i%every===0?esc(formatEarningsBucket(x.date,unit)):''}</small></div>`).join('')}</div>`;
}
function initEarningsGraphs(){
 document.querySelectorAll('.earningsOverviewGraph').forEach(graph=>{
   // Default to the 7-day view so recent verified earnings are visible immediately.
   const first=graph.querySelector('.earningsPeriods button[data-period="7d"]')||graph.querySelector('.earningsPeriods button');
   if(first)setEarningsPeriod(first.dataset.period,first);
 });
}

function about(){return `<section class="section pageEnter"><div class="container infoPage"><div class="authHead"><span class="tag">ABOUT HUNAR</span><h1>A marketplace for Ethiopian clients and freelancers.</h1><p class="sectionLead">HUNAR provides tools for profiles, projects, applications, messaging, contracts, payments, and freelancer work.</p></div><article class="infoSection"><h2>What HUNAR does</h2><p>HUNAR connects clients with freelancers and provides marketplace tools for discovering work, communicating about projects, managing contracts, and recording payment activity.</p></article><article class="infoSection"><h2>Business information</h2><p><b>Brand:</b> HUNAR</p><p><b>Jurisdiction focus:</b> Ethiopia</p><p><b>Legal operator:</b> The legal name of the business or individual operating HUNAR must be published here before public launch.</p><p><b>Business address:</b> A valid business/contact address must be published here before public launch.</p><p><b>Support contact:</b> Use the HUNAR support channel available inside the platform.</p><div class="notice"><b>Launch requirement:</b> Replace the operator/address placeholders with the real registered business details. Do not publish invented legal information.</div></article></div></section>`}

function privacy(){return `<section class="section pageEnter"><div class="container infoPage"><div class="authHead"><span class="tag">HUNAR PRIVACY</span><h1>Privacy Policy</h1><p class="sectionLead">This policy explains what personal information HUNAR collects, why it is used, who may receive it, and the choices available to users.</p><p class="legalMeta">Last updated: September 2026 · Review this policy with Ethiopian legal counsel before public launch.</p></div><article class="infoSection"><h2>1. Information HUNAR collects</h2><p>Depending on the feature you use, HUNAR may collect account information such as your name, email address, profile information, city/region, professional information, portfolio content, messages, project and application information, identity-verification information, payment-related records, and support requests.</p></article><article class="infoSection"><h2>2. How HUNAR uses information</h2><ul><li>Create and secure accounts and complete email verification.</li><li>Operate profiles, projects, applications, messaging, contracts, and support.</li><li>Process and reconcile payments and withdrawals through payment providers.</li><li>Perform identity and security checks when a feature requires them.</li><li>Prevent fraud, abuse, unauthorized access, and misuse of the marketplace.</li><li>Meet legal, regulatory, accounting, and dispute-resolution requirements.</li></ul></article><article class="infoSection"><h2>3. Service providers</h2><p>HUNAR uses third-party infrastructure and service providers to operate the platform. Current integrations include Supabase for application/database/authentication infrastructure, Chapa for payment services, and an email delivery provider for verification messages. Those providers may process information needed to perform their services.</p></article><article class="infoSection"><h2>4. Payments</h2><p>HUNAR does not ask users to place payment-card or bank credentials into ordinary chat messages. Payment processing is handled through the payment provider flow. HUNAR keeps transaction and payment-order records needed for reconciliation, contracts, support, accounting, and fraud prevention.</p></article><article class="infoSection"><h2>5. Identity verification</h2><p>Identity documents and selfies are sensitive information. Provide them only through HUNAR's designated verification flow. Access should be limited to authorized personnel and service providers who need it for verification, security, or legal purposes. HUNAR should publish its exact retention period and deletion process before launch.</p></article><article class="infoSection"><h2>6. Storage, security and international processing</h2><p>HUNAR uses technical and organizational safeguards intended to protect personal information. Because cloud and service providers may operate infrastructure in different countries, personal information may be processed outside Ethiopia where permitted and appropriate safeguards are in place.</p></article><article class="infoSection"><h2>7. Retention and deletion</h2><p>HUNAR keeps information only for as long as reasonably necessary for the purposes described in this policy, including account operation, security, payments, disputes, legal obligations, and record keeping. Exact retention schedules should be finalized and documented before launch. Users may request access, correction, or deletion where applicable, subject to legal and operational exceptions.</p></article><article class="infoSection"><h2>8. User choices and rights</h2><p>Users may contact HUNAR about their personal information, request correction of inaccurate information, ask questions about processing, and withdraw consent where processing is based on consent, subject to applicable law and the need to keep information required to operate an account or satisfy legal obligations.</p></article><article class="infoSection"><h2>9. No optional advertising analytics at present</h2><p>HUNAR's current website build does not include an obvious Google Analytics, Google Tag Manager, Meta Pixel, Hotjar, Microsoft Clarity, or advertising tracker. HUNAR does use necessary browser storage for things such as preferences and marketplace state. If optional analytics or advertising technology is added later, this policy and the cookie controls should be updated before activation.</p></article><article class="infoSection"><h2>10. Children</h2><p>HUNAR is intended for users who are legally able to enter the applicable agreements. Do not create an account using another person's identity or information. If HUNAR later permits minors, age-specific rules and parental-consent requirements should be added.</p></article><article class="infoSection"><h2>11. Contact and complaints</h2><p>Publish the legal operator's real contact details before launch so users can submit privacy questions and complaints to the responsible operator.</p></article></div></section>`}

function refunds(){return `<section class="section pageEnter"><div class="container infoPage"><div class="authHead"><span class="tag">HUNAR REFUNDS</span><h1>Refund Policy</h1><p class="sectionLead">This policy explains the general handling of payments, cancellations, refunds, and disputed work on HUNAR.</p><p class="legalMeta">Last updated: September 2026 · Have the final policy reviewed for the exact HUNAR business model before launch.</p></div><article class="infoSection"><h2>1. Payment provider</h2><p>Payments are processed through the payment provider shown at checkout. A successful payment is recorded by HUNAR only after the payment result can be verified server-side.</p></article><article class="infoSection"><h2>2. Contract payments</h2><p>Clients should review the contract amount, scope, milestones, delivery expectations, and other terms before funding a contract. A payment does not by itself guarantee that a client will receive a refund or that a freelancer will receive funds immediately.</p></article><article class="infoSection"><h2>3. Cancellations and refunds</h2><p>Refund eligibility depends on the contract status, work already delivered, payment status, applicable law, and the facts of the dispute. HUNAR may review the contract, messages, submitted work, payment records, and other relevant evidence before deciding how a platform dispute should be handled.</p></article><article class="infoSection"><h2>4. Completed or approved work</h2><p>Once work has been approved or otherwise released under the applicable contract workflow, a refund is not automatically guaranteed. Users should resolve scope and quality issues before approving work whenever possible.</p></article><article class="infoSection"><h2>5. Payment-provider reversals</h2><p>If a payment provider reverses, fails, or disputes a transaction, HUNAR may update the related payment and contract status and take reasonable steps to reconcile the records.</p></article><article class="infoSection"><h2>6. HUNAR platform fee</h2><p>HUNAR currently applies a 10% platform fee to transactions as described in the applicable contract or payment screen. The exact treatment of the fee in a refund should be shown clearly before payment and should be finalized in the commercial terms reviewed for launch.</p></article><article class="infoSection"><h2>7. How to request help</h2><p>Keep the contract, project scope, messages, submitted files, and payment reference available when asking HUNAR to review a dispute. Never send an OTP, password, or payment authentication secret to support.</p></article></div></section>`}

function cookies(){return `<section class="section pageEnter"><div class="container infoPage"><div class="authHead"><span class="tag">HUNAR COOKIES</span><h1>Cookie & Browser Storage Policy</h1><p class="sectionLead">HUNAR currently uses necessary browser storage to keep the application working and does not intentionally activate optional advertising or analytics cookies in this build.</p><p class="legalMeta">Last updated: September 2026</p></div><article class="infoSection"><h2>1. Necessary storage</h2><p>HUNAR may use browser storage such as localStorage and sessionStorage for preferences, temporary signup state, saved marketplace items, message-view state, and other application functions. Authentication and security mechanisms may also use storage or cookies supplied by the authentication infrastructure.</p></article><article class="infoSection"><h2>2. Optional tracking</h2><p>The current build was checked for common analytics and advertising integrations and no obvious Google Analytics, Google Tag Manager, Meta Pixel, Hotjar, Microsoft Clarity, or similar advertising/analytics scripts were found. HUNAR should update this policy and add appropriate consent controls before introducing optional tracking.</p></article><article class="infoSection"><h2>3. Cookie consent</h2><p>Because the current build is limited to necessary storage, the site does not ask users to opt in to optional analytics or advertising cookies. This is not a legal determination for every future technology or jurisdiction; the operator should reassess consent requirements whenever tracking, advertising, or non-essential cookies are introduced.</p></article><article class="infoSection"><h2>4. Browser controls</h2><p>Users can clear or restrict browser storage through their browser settings. Restricting necessary storage may prevent parts of HUNAR from functioning correctly.</p></article></div></section>`}

function backSafe(){
  const raw=location.hash.slice(1),route=(raw.split('?')[0]||'home');
  if(route==='register'){
    const qs=new URLSearchParams(raw.split('?')[1]||''),role=qs.get('role')||sessionStorage.getItem('hunar_signup_role')||signupRole||'client',step=Number(qs.get('step')||1);
    if(step>1){go('register?role='+encodeURIComponent(role)+'&step='+(step-1));return}
  }
  try{
    const stack=JSON.parse(sessionStorage.getItem('hunar_app_history')||'[]');
    const blocked=new Set(['home','signup','signin','forgot-password','reset-password','google-role','auth-callback']);
    while(stack.length){
      const previous=stack.pop(),previousRoute=String(previous||'').split('?')[0];
      if(!previous||blocked.has(previousRoute)||previous===raw)continue;
      sessionStorage.setItem('hunar_app_history',JSON.stringify(stack));
      location.hash=previous;return;
    }
    sessionStorage.setItem('hunar_app_history','[]');
  }catch(e){}
  // Never force an authenticated user to a public page. Stay in the inner workspace.
  const fallback=me?'dashboard':'home';
  location.hash=fallback;
}

function translateTree(root){
  if(!root||lang!=='am')return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let n;
  while(n=walker.nextNode()){const raw=n.nodeValue.trim();if(!raw)continue;const repl=AM[raw];if(repl)n.nodeValue=n.nodeValue.replace(raw,repl)}
  root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{if(AM[el.placeholder])el.placeholder=AM[el.placeholder]});
  root.querySelectorAll('input[value],option').forEach(el=>{if(AM[el.value||el.textContent.trim()]){if(el.tagName==='INPUT')el.value=AM[el.value];else el.textContent=AM[el.textContent.trim()]}});
  root.querySelectorAll('[title],button[aria-label]').forEach(el=>{const v=el.title||el.getAttribute('aria-label');if(v&&AM[v]){if(el.title)el.title=AM[v];if(el.hasAttribute('aria-label'))el.setAttribute('aria-label',AM[v])}});
}

async function postProject(e){
  e.preventDefault();
  if(!me||me.role!=='client'){go('signin?role=client');return}
  if(!productionUser){alert('Please sign in with a real HUNAR account.');return}
  const form=e.target;
  if(form.dataset.submitting==='1')return;
  const f=new FormData(form);
  if(!document.getElementById('postTermsConsent')?.checked){alert('Please confirm the Terms of Use before posting.');return}
  const title=String(f.get('title')||'').trim(),description=String(f.get('desc')||'').trim();
  const minRaw=String(f.get('min')||'').trim(),maxRaw=String(f.get('max')||'').trim();
  const min=minRaw?Number(minRaw):null,max=maxRaw?Number(maxRaw):null;
  if(title.length<3){alert('Please enter a project title.');return}
  if(description.length<20){alert('Please add a little more detail to the project description.');return}
  if(min!==null&&(!Number.isFinite(min)||min<0)){alert('Please enter a valid minimum budget.');return}
  if(max!==null&&(!Number.isFinite(max)||max<0)){alert('Please enter a valid maximum budget.');return}
  if(min!==null&&max!==null&&min>max){alert('Minimum budget cannot exceed maximum budget.');return}
  form.dataset.submitting='1';
  const btn=form.querySelector('button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Posting…'}
  const data={title,category:String(f.get('category')||''),budget_min_etb:min,budget_max_etb:max,deadline:String(f.get('deadline')||'')||null,skills:String(f.get('skills')||'').split(',').map(x=>x.trim()).filter(Boolean),description,status:'posted'};
  try{await HunarData.projects.create(data);await syncProductionData();go('projects')}catch(err){console.error('HUNAR project post:',err);alert(String(err?.message||err||'Project could not be posted.'))}
  finally{form.dataset.submitting='0';if(btn){btn.disabled=false;btn.textContent='Post Project →'}}
}

<script>
(function(){
  const scene=document.querySelector('.hero .scene');
  if(!scene || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const visual=scene.closest('.heroVisual');
  let tx=0,ty=0,cx=0,cy=0,raf=0;
  function frame(){
    cx+=(tx-cx)*0.06; cy+=(ty-cy)*0.06;
    scene.style.transform='rotateY('+(-7+cx*5)+'deg) rotateX('+(4+cy*4)+'deg)';
    raf=requestAnimationFrame(frame);
  }
  visual.addEventListener('pointermove',function(e){
    const r=visual.getBoundingClientRect();
    tx=(e.clientX-r.left)/r.width-.5;
    ty=(e.clientY-r.top)/r.height-.5;
    if(!raf) raf=requestAnimationFrame(frame);
  });
  visual.addEventListener('pointerleave',function(){tx=0;ty=0});
  frame();
})();
</script>

      mx += (tx-mx)*.055; my += (ty-my)*.055;
      const a=layer.querySelector('.a'),b=layer.querySelector('.b'),c=layer.querySelector('.c'),r=layer.querySelector('.hunar-fx-ring');
      if(a)a.style.transform='translate3d('+mx*.65+'px,'+my*.65+'px,0) rotateX('+(-my*.45)+'deg) rotateY('+(mx*.5)+'deg)';
      if(b)b.style.transform='translate3d('+mx*.95+'px,'+my*.9+'px,0) rotateX('+(my*.55)+'deg) rotateY('+(-mx*.65)+'deg)';
      if(c)c.style.transform='translate3d('+mx*1.2+'px,'+my*1.15+'px,0) rotateX('+(-my*.8)+'deg) rotateY('+(mx*.9)+'deg)';
      if(r)r.style.marginLeft=(mx*.7)+'px';
      requestAnimationFrame(frame);
    }
    frame();

    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function decorate(){
      const app=document.getElementById('app');
      if(!app)return;
      app.classList.add('hunar-page-shell');
      app.querySelectorAll('h1,h2,h3,.section-title,.page-title').forEach(function(el){el.classList.add('hunar-reveal')});
      app.querySelectorAll('.card,.service,.devcard,.project,.profile-card,.result-card,.stat,.panel,.box,.item,.tile').forEach(function(el){
        el.classList.add('hunar-depth','hunar-reveal');
      });
      if(reduce)return;
      app.querySelectorAll('.hunar-depth').forEach(function(el){
        if(el.dataset.hunarTilt)return;
        el.dataset.hunarTilt='1';
        el.addEventListener('pointermove',function(e){
          const r=el.getBoundingClientRect();
          const ry=((e.clientX-r.left)/r.width-.5)*5;
          const rx=-((e.clientY-r.top)/r.height-.5)*5;
          el.style.setProperty('--rx',rx.toFixed(2)+'deg');
          el.style.setProperty('--ry',ry.toFixed(2)+'deg');
        });
        el.addEventListener('pointerleave',function(){el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')});
      });
      const obs=new IntersectionObserver(function(entries){entries.forEach(function(x){if(x.isIntersecting)x.target.classList.add('is-visible')})},{threshold:.08});
      app.querySelectorAll('.hunar-reveal').forEach(function(el){obs.observe(el)});
    }
    decorate();
    const originalRender=window.render;
    if(typeof originalRender==='function'){
      window.render=function(){
        const out=originalRender.apply(this,arguments);
        setTimeout(decorate,40);
        setTimeout(decorate,250);
        return out;
      };
    }
    window.addEventListener('hashchange',function(){setTimeout(decorate,80)});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initHunarVisualLayer);else initHunarVisualLayer();
})();
</script>
<script>
(function(){
  function initDragOrb(){const orb=document.querySelector('.hunar-drag-orb');if(!orb||orb.dataset.bound)return;orb.dataset.bound='1';let down=false,sx=0,sy=0,ox=0,oy=0;const parent=orb.parentElement;orb.addEventListener('pointerdown',e=>{down=true;orb.setPointerCapture?.(e.pointerId);const r=orb.getBoundingClientRect(),pr=parent.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left-pr.left;oy=r.top-pr.top;orb.style.animation='none'});orb.addEventListener('pointermove',e=>{if(!down)return;const pr=parent.getBoundingClientRect();let x=ox+(e.clientX-sx),y=oy+(e.clientY-sy);x=Math.max(0,Math.min(pr.width-orb.offsetWidth,x));y=Math.max(0,Math.min(pr.height-orb.offsetHeight,y));orb.style.left=x+'px';orb.style.top=y+'px';orb.style.right='auto'});orb.addEventListener('pointerup',()=>{down=false});orb.addEventListener('pointercancel',()=>{down=false})}
  function bind(){initDragOrb();}
  const oldRender=window.render;if(typeof oldRender==='function'){window.render=function(){const out=oldRender.apply(this,arguments);setTimeout(bind,50);return out}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();window.addEventListener('hashchange',()=>setTimeout(bind,80));
})();
</script>
