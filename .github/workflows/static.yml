# Deploy the exact HUNAR ZIP version to GitHub Pages
name: Deploy HUNAR ZIP to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare HUNAR ZIP
        run: |
          rm -rf _site _unzipped
          mkdir -p _site
          unzip -q HUNAR-V54-GITHUB-PAGES-READY.zip -d _unzipped
          if [ -f _unzipped/index.html ]; then
            cp -a _unzipped/. _site/
          else
            ROOT=$(find _unzipped -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$ROOT" ] && [ -f "$ROOT/index.html" ]; then
              cp -a "$ROOT"/. _site/
            else
              echo 'HUNAR ZIP does not contain index.html' >&2
              exit 1
            fi
          fi
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload HUNAR site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
