# Deploy the restored HUNAR application directly from the repository
name: Deploy HUNAR Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the restored HUNAR application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # The restored new HUNAR application is already the repository root
          # index.html. Do NOT extract or select an index from the old V54 ZIP.
          test -f index.html
          SIZE=$(wc -c < index.html)
          echo "Repository index.html size: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "Refusing to deploy: the restored HUNAR index is unexpectedly small." >&2
            exit 1
          fi

          cp index.html _site/index.html
          if [ -f 404.html ]; then cp 404.html _site/404.html; fi
          touch _site/.nojekyll

          echo 'Final deployed root:'
          find _site -maxdepth 1 -type f -printf '%s %p\n' | sort -nr

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload HUNAR site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy HUNAR site
        id: deployment
        uses: actions/deploy-pages@v4
