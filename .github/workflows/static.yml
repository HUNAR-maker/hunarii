# Deploy one canonical HUNAR V54 build
name: Deploy HUNAR Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build one canonical HUNAR V54 site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _v54
          mkdir -p _site _v54
          test -f HUNAR-V54-GITHUB-PAGES-READY.zip
          unzip -q HUNAR-V54-GITHUB-PAGES-READY.zip -d _v54

          mapfile -t INDEXES < <(find _v54 -type f -name index.html -printf '%s %p\n' | sort -nr)
          test "${#INDEXES[@]}" -gt 0
          APP_INDEX="${INDEXES[0]#* }"
          APP_DIR="$(dirname "$APP_INDEX")"
          APP_SIZE="${INDEXES[0]%% *}"

          echo "Using V54 application: $APP_DIR"
          echo "V54 index size: $APP_SIZE bytes"
          cp -a "$APP_DIR"/. _site/
          touch _site/.nojekyll
          test -s _site/index.html
          echo "Canonical V54 site prepared."
          find _site -maxdepth 3 -type f | sort | head -200

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload canonical HUNAR site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy canonical HUNAR site
        id: deployment
        uses: actions/deploy-pages@v4
