name: Deploy HUNAR Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the single V54 application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _v54
          mkdir -p _site _v54
          unzip -q HUNAR-V54-GITHUB-PAGES-READY.zip -d _v54
          mapfile -t INDEXES < <(find _v54 -type f -name index.html -printf '%s %p\n' | sort -nr)
          test "${#INDEXES[@]}" -gt 0
          APP_INDEX="${INDEXES[0]#* }"
          APP_DIR="$(dirname "$APP_INDEX")"
          cp -a "$APP_DIR"/. _site/

          # Restore the production bridge used by the HUNAR application.
          curl -fsSL https://raw.githubusercontent.com/HUNAR-maker/hunarii/0c72efca60ccc02902bef2129b2779242f7d1f37/hunar-services.js -o _site/hunar-services.js
          # V54 references this file; provide it so the browser never receives a 404.
          printf '%s\n' '/* HUNAR safety bridge intentionally empty; V54 keeps safety checks inline. */' > _site/hunar-safety.js

          # Let Supabase consume OAuth sessions returned in the URL fragment.
          sed -i 's/detectSessionInUrl:false/detectSessionInUrl:true/g' _site/hunar-services.js

          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/hunar-services.js
          test -s _site/hunar-safety.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload HUNAR site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy HUNAR site
        id: deployment
        uses: actions/deploy-pages@v4
