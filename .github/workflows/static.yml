# Deploy exactly one complete HUNAR V54 application
name: Deploy HUNAR Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build one canonical HUNAR V54 site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _v54
          mkdir -p _site _v54

          ZIP="HUNAR-V54-GITHUB-PAGES-READY.zip"
          test -f "$ZIP"
          unzip -q "$ZIP" -d _v54

          mapfile -t INDEXES < <(find _v54 -type f -name index.html -printf '%s %p\n' | sort -nr)
          test "${#INDEXES[@]}" -gt 0

          APP_DIR=""
          for entry in "${INDEXES[@]}"; do
            size="${entry%% *}"
            path="${entry#* }"
            if [ "$size" -ge 500000 ]; then
              APP_DIR="$(dirname "$path")"
              break
            fi
          done

          if [ -z "$APP_DIR" ]; then
            echo "STOP: V54 package does not contain a complete application." >&2
            printf '%s\n' "${INDEXES[@]}" >&2
            exit 1
          fi

          echo "Canonical application: $APP_DIR"
          cp -a "$APP_DIR"/. _site/
          touch _site/.nojekyll

          # Critical runtime files must exist at the same root as index.html.
          for required in hunar-services.js hunar-safety.js; do
            if [ ! -f "_site/$required" ]; then
              FOUND="$(find _site -type f -name "$required" -print -quit || true)"
              if [ -n "$FOUND" ]; then cp "$FOUND" "_site/$required"; fi
            fi
            test -s "_site/$required"
          done

          test -s _site/index.html
          test "$(wc -c < _site/index.html)" -ge 500000

          echo "CANONICAL HUNAR BUILD VERIFIED"
          sha256sum _site/index.html _site/hunar-services.js _site/hunar-safety.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload canonical HUNAR site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy canonical HUNAR site
        id: deployment
        uses: actions/deploy-pages@v4
