# Deploy the current HUNAR application from the repository root
name: Deploy HUNAR Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the current HUNAR build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          test -f index.html
          INDEX_SIZE=$(wc -c < index.html)
          echo "Deploying root HUNAR index: ${INDEX_SIZE} bytes"
          if [ "$INDEX_SIZE" -lt 500000 ]; then
            echo "Refusing to deploy an incomplete HUNAR index." >&2
            exit 1
          fi
          cp -a index.html _site/
          # Deploy every current repository asset/file needed by the root build.
          for item in assets css js img images fonts favicon.ico hunar-services.js hunar-safety.js; do
            if [ -e "$item" ]; then cp -a "$item" _site/; fi
          done
          touch _site/.nojekyll
          echo "Final deployed files:"
          find _site -maxdepth 3 -type f -printf '%s %p\n' | sort -nr | head -60

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload HUNAR site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy HUNAR site
        id: deployment
        uses: actions/deploy-pages@v4
