name: Restore HUNAR live application
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete HUNAR app
        run: |
          git show 1c0715df6df0cafd5891303059d4466aa095c496:index.html > index.html
          test -s index.html
      - name: Commit restored app
        run: |
          git config user.name 'HUNAR-maker'
          git config user.email 'hosammustefa7@gmail.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore complete HUNAR application [skip ci]'
          git push