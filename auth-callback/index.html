<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>HUNAR — Signing in…</title></head>
<body>
<script>
(function () {
  var base = '/hunarii/';
  // Preserve the OAuth callback exactly. Do not manufacture a second '#'
  // and do not discard ?code= or ?state=, because Supabase PKCE needs them.
  var target = base;
  if (window.location.search) target += window.location.search;
  if (window.location.hash) target += window.location.hash;
  window.location.replace(target);
})();
</script>
<noscript><a href="/hunarii/">Continue to HUNAR</a></noscript>
</body>
